<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataDesk — Data Analysis, Dashboards & Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#f2f4f9;--panel:#ffffff;--ink:#141a2a;--ink2:#4a5468;--muted:#8a93a6;--line:#e2e6ee;--line2:#eef1f6;
  --good:#137a45;--good-soft:#e6f6ed;--warn:#9a6200;--warn-soft:#fff5dc;--bad:#c0392b;--bad-soft:#fdecea;
  --r:14px;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --acc:#2a78d6;--acc2:#1f63b5;--acc-soft:#eaf2fc;--acc-ink:#1b4f91;
}
body[data-ws=merge]{--acc:#2a78d6;--acc2:#1f63b5;--acc-soft:#e9f1fc;--acc-ink:#1b4f91}
body[data-ws=analysis]{--acc:#6250d6;--acc2:#4f3fc0;--acc-soft:#efecfd;--acc-ink:#3d2fa0}
body[data-ws=dash]{--acc:#0f9d6e;--acc2:#0b7f59;--acc-soft:#e3f6ee;--acc-ink:#0a6447}
body[data-ws=auto]{--acc:#d9730d;--acc2:#b85f08;--acc-soft:#fdf0e1;--acc-ink:#8f4a06}
body[data-ws=settings]{--acc:#475569;--acc2:#334155;--acc-soft:#eef1f5;--acc-ink:#334155}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.app{display:flex;flex-direction:column;height:100vh}
/* header */
.hdr{background:linear-gradient(115deg,#0b1222 0%,#141f38 55%,#1b2848 100%);color:#fff;display:flex;align-items:stretch;gap:20px;padding:0 20px;height:62px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:2}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:-.2px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b8cf0,#6250d6 55%,#0f9d6e);display:grid;place-items:center;box-shadow:0 4px 14px rgba(98,80,214,.45)}
.brand small{display:block;font-size:10.5px;color:#8f9bb5;font-weight:500;letter-spacing:.2px}
.ws-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.ws-tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 12px;color:#aab5cc;font-size:13.5px;font-weight:500;position:relative;white-space:nowrap;transition:color .15s,background .15s}
.ws-tabs button:hover{color:#fff;background:rgba(255,255,255,.04)}
.ws-tabs button .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;background:rgba(255,255,255,.08);transition:all .2s}
.ws-tabs button.on{color:#fff}
.ws-tabs button.on::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--c)}
.ws-tabs button.on .dot{background:var(--c);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ws-tabs .cnt{background:rgba(255,255,255,.14);border-radius:9px;padding:0 7px;font-size:11px}
.hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ds{font-size:12px;color:#cdd5e5;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.ds b{color:#fff}
.hbtn{all:unset;cursor:pointer;color:#d0d8e8;padding:5px 11px;font-size:15px!important;border-radius:8px;font-size:12.5px;border:1px solid rgba(255,255,255,.14);transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.08)}
.hbtn:disabled{opacity:.35;cursor:default}
/* sub nav */
.subnav{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px;flex:none}
.tool-tabs{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:thin}
.tool-tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--ink2);white-space:nowrap;transition:all .15s}
.tool-tabs button:hover{background:var(--line2);color:var(--ink)}
.tool-tabs button.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent)}
.ask{width:min(440px,38vw);display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 12px;transition:border-color .15s,box-shadow .15s}
.ask:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ask input{flex:1;border:0;background:transparent;outline:none;padding:6px 0;min-width:0}
#view{flex:1;overflow:auto;padding:24px 28px 80px}
.view-in{animation:fade .28s ease;max-width:1500px;margin:0 auto}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px;display:flex;align-items:center}
h2{font-size:15.5px;margin:0 0 10px;letter-spacing:-.1px}
h3{font-size:13.5px;margin:0 0 8px}
.h-ic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:16px;margin-right:12px;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent);flex:none}
.sub{color:var(--ink2);margin:0 0 20px;padding-left:48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.card.current{border-left:4px solid var(--acc)}
.empty-mini{display:flex;gap:10px;align-items:center;color:var(--ink2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:500}
.btn:hover{border-color:#c5ccd9;background:#f9fafc;transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 3px 10px color-mix(in srgb,var(--acc) 30%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.big{padding:10px 18px;font-size:14.5px}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2);font-weight:600}
input.i,select.i,textarea.i{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s;font-weight:400;color:var(--ink)}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.i{resize:vertical;line-height:1.5}
input.clr{padding:3px;height:38px;cursor:pointer}
select.i[multiple]{min-height:100px}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--acc);width:15px;height:15px}
.drop{border:2px dashed color-mix(in srgb,var(--acc) 35%,#d6dce8);border-radius:16px;padding:32px 20px;text-align:center;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--acc-soft) 50%,#fff));cursor:pointer;transition:all .2s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc-soft);transform:scale(1.005)}
.drop .drop-ic{width:52px;height:52px;margin:0 auto 6px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent)}
.drop .big{font-size:17px;font-weight:700;margin:6px 0 2px}
.fmts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.fmts span{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.ftype{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:#e7f4ec;color:#167343;letter-spacing:.3px;vertical-align:1px}
.ftype.csv,.ftype.tsv{background:#e8f1fc;color:#1d5aa8}.ftype.json{background:#fff3df;color:#8c5a00}.ftype.xls{background:#e3f3ea;color:#0f5c34}.ftype.ods{background:#f3ecff;color:#5b3fb8}
.tile-link{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:all .2s;box-shadow:var(--shadow)}
.tile-link:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,24,40,.09)}
.tile-link .tl-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-ink);font-size:16px;margin-bottom:4px}
.tile-link span{color:var(--muted);font-size:12.5px}
.ab{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#2a78d6;color:#fff;font-size:12px}.ab.b{background:#eb6834}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.pill.num{background:#e8f1fc;color:#1f5fae}.pill.date{background:#f0edff;color:#5040b8}.pill.text{background:#eef7f1;color:#1d6b40}.pill.empty{background:#f4f4f4;color:#999}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#f6f7fb;text-align:left;font-weight:600;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th.sortable{cursor:pointer}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c{text-align:center;font-variant-numeric:tabular-nums}
table.t tr:hover td{background:#fafbfe}
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:12px}
.blank{color:#c0c6d2;font-style:italic}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--acc)}
.kpi.accent-good{border-top-color:#137a45}.kpi.accent-warn{border-top-color:#d9730d}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--good)!important}.down{color:var(--bad)!important}
.ins{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.ins:last-child{border-bottom:0}
.ins .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:14px;background:var(--acc-soft);color:var(--acc)}
.ins.warn .ic{background:var(--warn-soft);color:var(--warn)}.ins.bad .ic{background:var(--bad-soft);color:var(--bad)}.ins.good .ic{background:var(--good-soft);color:var(--good)}
.ins b{display:block;margin-bottom:1px}
.ins p{margin:0;color:var(--ink2)}
.tool{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);transition:border-color .2s}
.tool:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.tool h3{display:flex;gap:8px;align-items:center;margin:0}
.tool p{margin:0;color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:all .15s;color:var(--ink2)}
.chip:hover{border-color:var(--acc);color:var(--acc-ink);background:var(--acc-soft)}
.log{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#0f1522;color:#c9e4d0;border-radius:10px;padding:12px 14px;max-height:260px;overflow:auto;white-space:pre-wrap}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink2)}
.empty-state .e{font-size:40px;margin-bottom:8px}
.chartbox{position:relative;height:340px}
.chartbox.sm{height:260px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px}
.step .no{width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.agent{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s,border-color .2s;box-shadow:var(--shadow)}
.agent:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line));box-shadow:0 10px 26px rgba(16,24,40,.08)}
.agent .top2{display:flex;gap:10px;align-items:center}
.agent .av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:linear-gradient(135deg,var(--acc-soft),#fff);border:1px solid var(--line)}
.agent .drop{padding:12px;font-size:12.5px;border-radius:10px}
.muted{color:var(--muted)}.small{font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:#1c2230;color:#fff;padding:10px 14px;border-radius:11px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.2);animation:fade .2s;max-width:420px}
.toast.bad{background:#a83232}.toast.good{background:#13603a}
#modal{position:fixed;inset:0;background:rgba(15,20,35,.45);display:none;place-items:center;z-index:40;backdrop-filter:blur(2px)}
#modal.on{display:grid}
#modal .box{background:#fff;border-radius:16px;padding:22px;width:min(640px,92vw);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:fade .2s}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hint{background:var(--acc-soft);color:var(--acc-ink);border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
code{background:var(--line2);padding:1px 5px;border-radius:5px;font-size:12px}
/* dashboard */
.dtool .filt{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.dtool .filt select.i,.dtool .filt input.i{padding:6px 8px;font-size:13px}
.dtool .lbl{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.dtool .exp{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);transition:transform .15s}
.sw:hover{transform:scale(1.1)}.sw.on{outline:2.5px solid var(--ink);outline-offset:2px}
.dboard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.dhead{background:linear-gradient(120deg,var(--dh),color-mix(in srgb,var(--dh) 75%,var(--da)));color:#fff;border-radius:13px;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.dtitle{font-size:22px;font-weight:700;letter-spacing:-.3px}
.dsub{font-size:12.5px;opacity:.85;margin-top:2px}
.dmeta{font-size:11.5px;opacity:.75;white-space:nowrap}
.kpis{display:grid;gap:12px;margin-bottom:14px}
.ktile{background:linear-gradient(180deg,var(--dt),#fff);border:1px solid var(--line);border-left:5px solid var(--kc);border-radius:12px;padding:12px 14px;min-width:0}
.ktile .kl{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;gap:6px}
.ktile .kv{font-size:26px;font-weight:700;color:var(--dh);letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktile .kd{font-size:11.5px;color:var(--muted);min-height:16px}
.kt,.wt{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.ktile:hover .kt,.wcard:hover .wt{opacity:1}
.kt button,.wt button{all:unset;cursor:pointer;font-size:11px;padding:2px 6px;border-radius:6px;color:var(--ink2);background:#fff;border:1px solid var(--line)}
.kt button:hover,.wt button:hover{border-color:var(--acc);color:var(--acc)}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wcard{border:1px solid var(--line);border-radius:13px;padding:12px 14px 14px;background:#fff;min-width:0;transition:box-shadow .2s}
.wcard:hover{box-shadow:0 8px 22px rgba(16,24,40,.07)}
.wcard.w2{grid-column:span 2}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid var(--wc);color:var(--dh)}
.wc{position:relative;height:280px}.wc.wide{height:300px}
.wtab{max-height:300px;overflow:auto}
table.t.mini th{background:var(--dh);color:#fff;font-size:12px;padding:7px 9px}
table.t.mini td{font-size:12.5px;padding:6px 9px}
table.t.mini tr:nth-child(even) td{background:var(--dt)}
.cpick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cp{all:unset;cursor:pointer;width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.cp.on{outline:2.5px solid var(--ink);outline-offset:2px}
.cp-custom{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
#offscreen .dboard{border:0;box-shadow:none;border-radius:0}
/* email */
.email-grid{grid-template-columns:minmax(380px,1fr) minmax(380px,1fr);align-items:start}
.att{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.attc{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:13px;transition:all .15s}
.attc.on{border-color:var(--acc);background:var(--acc-soft)}
.attc input{accent-color:var(--acc)}
.em-prev{border:1px solid var(--line);border-radius:12px;overflow:hidden}

const S={kindOverride:{},tables:[],data:null,name:'',srcFormat:'xlsx',undo:[],redo:[],steps:[],result:null,tab:'a_open',charts:{},ui:{page:0,search:'',sortCol:null,sortDir:1},profileCache:null,history:[]};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

  if(v==null||isDate(v))return null;

  const n=parseFloat(s);return isFinite(n)?n:null;

const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MNAME=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mkDate(y,m,d,h,mi,s){y=+y;m=+m;d=+d;if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<1900||y>2200)return null;const dt=new Date(y,m-1,d,+(h||0),+(mi||0),+(s||0));return dt.getMonth()===m-1?dt:null}

  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?(?:\s*[AaPp][Mm])?$/)){let d=+m[1],mo=+m[2];if(mo>12&&d<=12)[d,mo]=[mo,d];let h=m[4];if(h&&/pm$/i.test(s)&&+h<12)h=+h+12;return mkDate(m[3],mo,d,h,m[5],m[6])}

const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function fmtCell(v){

  if(typeof v==='number'){if(Number.isInteger(v))return Math.abs(v)>=1e15?String(v):v.toLocaleString(LOC());return v.toLocaleString(LOC(),{maximumFractionDigits:2})}

}

  else{if(a>=1e7)return sg+(a/1e7).toFixed(dec)+' Cr';if(a>=1e5)return sg+(a/1e5).toFixed(dec)+' L'}

}
const pct=(n,d=1)=>n==null||!isFinite(n)?'—':(n>0?'+':'')+(n*100).toFixed(d)+'%';

const normKey=v=>isDate(v)?iso(v):String(v??'').trim().toLowerCase();

function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('#toasts').appendChild(t);const all=$$('#toasts .toast');if(all.length>3)all.slice(0,all.length-3).forEach(x=>x.remove());setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s'},3600);setTimeout(()=>t.remove(),4000)}

const SET_DEFAULT={dateFmt:'DD-MM-YYYY',numStyle:'indian',currency:'',theme:'ocean',headerColor:'',chartColor:'',zebra:true,borders:true,freeze:true,filter:true,totals:true,dataTotals:false,dataTitle:false,font:'Calibri',fontSize:11,csvProtect:false,emailTo:'',emailCc:'',signName:''};

function fmtDate(d,withTime){const D=pad(d.getDate()),M=pad(d.getMonth()+1),Y=d.getFullYear(),Mn=MNAME[d.getMonth()];let s=({'DD-MM-YYYY':`${D}-${M}-${Y}`,'DD/MM/YYYY':`${D}/${M}/${Y}`,'YYYY-MM-DD':`${Y}-${M}-${D}`,'DD-MMM-YYYY':`${D}-${Mn}-${Y}`,'MM/DD/YYYY':`${M}/${D}/${Y}`})[SET.dateFmt]||`${D}-${M}-${Y}`;if(withTime===undefined?(d.getHours()||d.getMinutes()):withTime)s+=` ${pad(d.getHours())}:${pad(d.getMinutes())}`;return s}

/* ---------------- column typing & profile ---------------- */
function colType(rows,c){
  let n=0,num=0,dt=0;const lim=Math.min(rows.length,3000);
  for(let i=0;i<lim;i++){const v=rows[i][c];if(isBlank(v))continue;n++;
    if(typeof v==='number')num++;else if(isDate(v))dt++;
    else if(typeof v==='string'){if(looksId(v))continue;if(toNum(v)!==null)num++;else if(parseDate(v))dt++}}
  if(!n)return 'empty';if(num/n>=.9)return 'number';if(dt/n>=.9)return 'date';return 'text';
}
function profile(){
  if(S.profileCache)return S.profileCache;
  const d=S.data;if(!d)return [];
  const out=d.cols.map(c=>{
    const t=colType(d.rows,c);const vals=d.rows.map(r=>r[c]);
    let missing=0;const uniq=new Map();const nums=[];let dates=[];
    for(const v of vals){if(isBlank(v)){missing++;continue}const k=normKey(v);uniq.set(k,(uniq.get(k)||0)+1);
      if(t==='number'){const n=toNum(v);if(n!==null)nums.push(n)}else if(t==='date'){const dd=parseDate(v);if(dd)dates.push(dd)}}
    const p={col:c,type:t,count:vals.length,missing,filled:vals.length-missing,unique:uniq.size};
    if(nums.length){const s=[...nums].sort((a,b)=>a-b);Object.assign(p,{sum:sum(nums),mean:mean(nums),median:quant(s,.5),min:s[0],max:s[s.length-1],std:std(nums),q1:quant(s,.25),q3:quant(s,.75)})}
    if(dates.length){let mn=dates[0],mx=dates[0];for(const x of dates){if(x<mn)mn=x;if(x>mx)mx=x}p.min=mn;p.max=mx}
    p.top=[...uniq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
    return p;
  });

}
const colsOfType=(t)=>profile().filter(p=>p.type===t).map(p=>p.col);
function guessValueCol(){
  const nums=profile().filter(p=>p.type==='number'&&p.unique>1);
  const re=/revenue|sales|amount|amt|total|value|turnover|income|price|net|gross|billing|payment|consumption|usage|qty|quantity/i;
  const named=nums.filter(p=>re.test(p.col)&&!/id$|code|pin|phone|mobile|iccid|imei/i.test(p.col));
  const pref=['revenue','sales','amount','total','value'];
  for(const k of pref){const f=named.find(p=>p.col.toLowerCase().includes(k));if(f)return f.col}
  if(named.length)return named[0].col;
  const cand=nums.filter(p=>!/id$|^id|code|pin|phone|mobile|iccid|imei|year|month|day/i.test(p.col));
  return (cand.sort((a,b)=>Math.abs(b.sum||0)-Math.abs(a.sum||0))[0]||nums[0]||{}).col||null;
}
const guessDateCol=()=>{const ds=colsOfType('date');return ds.find(c=>/date|time|month|day|period/i.test(c))||ds[0]||null};
function guessCatCols(){const n=S.data.rows.length;return profile().filter(p=>p.type==='text'&&p.unique>1&&p.unique<=Math.max(60,n*.05)&&p.unique<n).sort((a,b)=>a.unique-b.unique).map(p=>p.col)}

/* ---------------- file reading ---------------- */
function sniff(name,buf){
  const b=new Uint8Array(buf.slice(0,8));const ext=(name.includes('.')?name.split('.').pop():'').toLowerCase();let kind;
  if(b[0]===0x50&&b[1]===0x4b)kind='zip';
  else if(b[0]===0xD0&&b[1]===0xCF&&b[2]===0x11&&b[3]===0xE0)kind='ole';
  else{const head=new TextDecoder().decode(new Uint8Array(buf.slice(0,600))).replace(/^﻿/,'').trimStart().toLowerCase();
    if(head.startsWith('{')||head.startsWith('['))kind='json';
    else if(head.startsWith('<'))kind=(head.includes('urn:schemas-microsoft-com:office:spreadsheet')||head.includes('<workbook'))?'xml':'html';
    else kind='text'}
  return {ext,kind};
}
function decodeText(buf){let t=new TextDecoder('utf-8').decode(buf);if((t.match(/\uFFFD/g)||[]).length>3){try{t=new TextDecoder('windows-1252').decode(buf)}catch(e){}}return t.replace(/^﻿/,'')}

  if(typeof v!=='string')return v;
  if(v==='')return '';

  return v;
}
function tableFromAoa(aoa,meta,smart){
  aoa=aoa.filter(r=>Array.isArray(r)&&r.some(x=>!isBlank(x)));
  if(!aoa.length)return null;
  const counts=aoa.slice(0,15).map(r=>r.filter(x=>!isBlank(x)).length);let mx=0;for(const c of counts)if(c>mx)mx=c;
  let h=counts.findIndex(c=>c>=Math.max(1,Math.ceil(mx*.6)));if(h<0)h=0;
  let width=0;for(let i=h;i<aoa.length;i++){if(aoa[i].length>width)width=aoa[i].length}
  const cols=[];for(let i=0;i<width;i++){let n=aoa[h][i];n=isBlank(n)?`Column_${i+1}`:isDate(n)?iso(n):String(n).replace(/\s+/g,' ').trim();cols.push(uniqName(n,cols))}
  const rows=[];for(let r=h+1;r<aoa.length;r++){const src=aoa[r],o={};for(let i=0;i<width;i++){let v=src[i];if(v===undefined)v='';else if(isDate(v))v=new Date(Math.round(+v/6e4)*6e4);o[cols[i]]=smart?smartVal(v):v}rows.push(o)}

const WB_EXT=['xlsx','xlsm','xlsb','xls','ods','xml'];
async function ingest(name,buf,out,origin,note=''){
  const {ext,kind}=sniff(name,buf);

  const realMap={zip:'xlsx',ole:'xls',xml:'xml',html:'html',json:'json',text:'csv'};
  let real=realMap[kind];

    const zip=await JSZip.loadAsync(buf);

    const entries=Object.values(zip.files).filter(e=>!e.dir&&!e.name.startsWith('__MACOSX')&&!/(^|\/)\./.test(e.name));
    if(!entries.length)throw new Error('ZIP is empty');
    for(const e of entries){const b=await e.async('arraybuffer');try{await ingest(e.name.split('/').pop(),b,out,`${name} › ${e.name}`,'from ZIP')}catch(err){toast(`Skipped ${e.name}: ${err.message}`,'bad')}}
    return;
  }
  if(kind==='ole'||kind==='xml')return addWorkbook(name,buf,ext,real,label,out,false,note);
  if(kind==='html')return addWorkbook(name,buf,ext,'html',label,out,true,note);
  if(kind==='json'){
    let j=JSON.parse(decodeText(buf));
    if(!Array.isArray(j)){const arr=Object.values(j).find(Array.isArray);j=arr||[j]}
    const cols=[];j.forEach(r=>{if(r&&typeof r==='object')Object.keys(r).forEach(k=>{if(!cols.includes(k))cols.push(k)})});
    const rows=j.map(r=>{const o={};cols.forEach(c=>{let v=r?.[c];if(v&&typeof v==='object')v=JSON.stringify(v);o[c]=v??''});return o});
    out.push(mkTable({label,file:name,ext:ext||'json',real:'json',note,cols,rows}));return;

  if(t)out.push(mkTable(t));
}
function addWorkbook(name,buf,ext,real,label,out,rawText,note){
  const wb=XLSX.read(buf,{type:'array',cellDates:true,raw:rawText});
  let n=0;
  for(const sh of wb.SheetNames){
    const ws=wb.Sheets[sh];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
    const t=tableFromAoa(aoa,{label:wb.SheetNames.length>1?`${label} › ${sh}`:label,file:name,sheet:sh,ext:ext||real,real,note},rawText);
    if(t&&t.rows.length){out.push(mkTable(t));n++}
  }
  if(!n)toast(`${name}: no data found in any sheet`,'bad');
}
let TID=1;
function mkTable(t){
  const extFmt={xls:'xls',xlsx:'xlsx',xlsm:'xlsx',xlsb:'xlsx',ods:'ods',csv:'csv',tsv:'tsv',txt:'csv',json:'json',htm:'xls',html:'xls',xml:'xlsx',dat:'csv'};

      if(isDate(v)){dt++;if(v.getHours()||v.getMinutes())tm++;continue}
      if(typeof v==='number'){num++;if(Number.isInteger(v))intc++;if(Math.abs(v)>=1e11)big++;if(v>mx)mx=v;if(v<mn)mn=v;continue}
      if(typeof v==='boolean')continue;

function appendTables(tabs,{source=false,loose=true}={}){

  const bCols=B.cols.filter(c=>c!==kb);const ren=new Map(bCols.map(c=>[c,A.cols.includes(c)?c+' (B)':c]));

    for(const [k,r] of idx){if(hit.has(k))continue;const o={};A.cols.forEach(c=>o[c]='');o[ka]=r[kb];bCols.forEach(c=>o[ren.get(c)]=r[c]);out.push(o)}

function compileFormula(expr,cols){

}

const OPS={
  trim:{label:p=>'Trim extra spaces',run(d){let n=0;const rows=d.rows.map(r=>{const o={...r};for(const c of d.cols){const v=o[c];if(typeof v==='string'){const t=v.replace(/[ \s]+/g,' ').trim();if(t!==v){o[c]=t;n++}}}return o});return{data:{cols:d.cols,rows},msg:`Trimmed spaces in ${n.toLocaleString()} cells`}}},

  dedupe:{label:p=>p.cols&&p.cols.length?`Remove duplicates by ${p.cols.join(', ')}`:'Remove duplicate rows',run(d,p){const cs=colsArg(d,p.cols);const seen=new Set();const rows=[];for(const r of d.rows){const k=cs.map(c=>normKey(r[c])).join('\u0001');if(seen.has(k))continue;seen.add(k);rows.push(r)}return{data:{cols:d.cols,rows},msg:`Removed ${(d.rows.length-rows.length).toLocaleString()} duplicate rows${p.cols&&p.cols.length?` (matched on ${cs.join(', ')})`:''}`}}},
  convertTypes:{label:()=>'Fix number & date formats',run(d){let n=0;const types={};d.cols.forEach(c=>types[c]=colType(d.rows,c));const rows=d.rows.map(r=>{const o={...r};for(const c of d.cols){const v=o[c];if(typeof v!=='string'||isBlank(v)||looksId(v))continue;if(types[c]==='number'){const x=toNum(v);if(x!==null&&Math.abs(x)<1e15){o[c]=x;n++}}else if(types[c]==='date'){const x=parseDate(v);if(x){o[c]=x;n++}}}return o});return{data:{cols:d.cols,rows},msg:`Converted ${n.toLocaleString()} text cells to real numbers/dates`}}},
  toNumber:{label:p=>`Convert ${p.col} to number`,run(d,p){need(d,p.col);let n=0,bad=0;const rows=d.rows.map(r=>{const o={...r};const v=o[p.col];if(isBlank(v))return o;const x=toNum(v);if(x===null)bad++;else{o[p.col]=x;n++}return o});return{data:{cols:d.cols,rows},msg:`Converted ${n} values in ${p.col}${bad?`, ${bad} could not be read as numbers`:''}`}}},
  toDate:{label:p=>`Convert ${p.col} to date`,run(d,p){need(d,p.col);let n=0,bad=0;const rows=d.rows.map(r=>{const o={...r};const v=o[p.col];if(isBlank(v)||isDate(v))return o;let x=parseDate(String(v));if(!x&&typeof v==='number'&&v>20000&&v<80000)x=new Date(Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4);if(x){o[p.col]=x;n++}else bad++;return o});return{data:{cols:d.cols,rows},msg:`Converted ${n} values in ${p.col} to dates${bad?`, ${bad} unreadable`:''}`}}},
  fillMissing:{label:p=>`Fill blanks in ${p.col==='*'?'all columns':p.col} with ${p.method==='value'?`"${p.value}"`:p.method}`,run(d,p){

  dropMissing:{label:p=>p.col==='*'?'Remove rows with any blank':`Remove rows where ${p.col} is blank`,run(d,p){const cs=colsArg(d,p.col);const rows=d.rows.filter(r=>!cs.some(c=>isBlank(r[c])));return{data:{cols:d.cols,rows},msg:`Removed ${(d.rows.length-rows.length).toLocaleString()} rows with blanks`}}},
  findReplace:{label:p=>`Replace "${p.find}" with "${p.replace}"${p.col&&p.col!=='*'?' in '+p.col:''}`,run(d,p){const cs=colsArg(d,p.col);let n=0;const re=p.regex?new RegExp(p.find,p.matchCase?'g':'gi'):new RegExp(String(p.find).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),p.matchCase?'g':'gi');const whole=p.whole;const rows=d.rows.map(r=>{const o={...r};for(const c of cs){const v=o[c];if(isBlank(v)&&p.find!=='')continue;const s=fmtCell(v);if(whole){if(s.toLowerCase()===String(p.find).toLowerCase()){o[c]=smartVal(p.replace);n++}}else if(re.test(s)){re.lastIndex=0;const ns=s.replace(re,p.replace);o[c]=typeof v==='number'?smartVal(ns):ns;n++}re.lastIndex=0}return o});return{data:{cols:d.cols,rows},msg:`Replaced in ${n.toLocaleString()} cells`}}},
  changeCase:{label:p=>`${p.mode} case: ${p.col}`,run(d,p){const cs=colsArg(d,p.col);const f=p.mode==='upper'?s=>s.toUpperCase():p.mode==='lower'?s=>s.toLowerCase():s=>s.toLowerCase().replace(/(^|[\s\-\/(])\w/g,c=>c.toUpperCase());const rows=d.rows.map(r=>{const o={...r};cs.forEach(c=>{if(typeof o[c]==='string')o[c]=f(o[c])});return o});return{data:{cols:d.cols,rows},msg:`Changed case in ${cs.join(', ')}`}}},
  removeChars:{label:p=>`Remove ${p.mode==='custom'?`"${p.chars}"`:p.mode} from ${p.col}`,run(d,p){const cs=colsArg(d,p.col);const re=p.mode==='nonDigits'?/\D/g:p.mode==='specials'?/[^\w\s.@-]/g:p.mode==='spaces'?/\s/g:p.mode==='letters'?/[A-Za-z]/g:new RegExp(`[${String(p.chars).replace(/[\]\\^-]/g,'\\$&')}]`,'g');let n=0;const rows=d.rows.map(r=>{const o={...r};cs.forEach(c=>{const v=o[c];if(isBlank(v)||isDate(v))return;const s=String(v),ns=s.replace(re,'');if(ns!==s){o[c]=ns;n++}});return o});return{data:{cols:d.cols,rows},msg:`Cleaned ${n.toLocaleString()} cells`}}},
  splitCol:{label:p=>`Split ${p.col} by "${p.delim}"`,run(d,p){need(d,p.col);const delim=p.delim===' '?/\s+/:p.delim;let max=0;const parts=d.rows.map(r=>{const a=isBlank(r[p.col])?[]:String(r[p.col]).split(delim).map(x=>x.trim());max=Math.max(max,a.length);return a});max=Math.min(max,10);const cols=[...d.cols];const newc=[];for(let i=0;i<max;i++){const n=uniqName(`${p.col}_${i+1}`,cols);cols.splice(cols.indexOf(p.col)+1+i,0,n);newc.push(n)}const rows=d.rows.map((r,j)=>{const o={...r};newc.forEach((c,i)=>o[c]=smartVal(parts[j][i]??''));return o});return{data:{cols,rows},msg:`Split ${p.col} into ${max} columns`}}},
  combineCols:{label:p=>`Combine ${p.cols.join(' + ')} → ${p.name}`,run(d,p){const cs=colsArg(d,p.cols);const name=uniqName(p.name||cs.join('_'),d.cols);const rows=d.rows.map(r=>({...r,[name]:cs.map(c=>fmtCell(r[c])).filter(x=>x!=='').join(p.sep??' ')}));return{data:{cols:[...d.cols,name],rows},msg:`Created ${name}`}}},
  filter:{label:p=>`Keep rows where ${p.col} ${condOps[p.op]} ${['blank','notblank'].includes(p.op)?'':p.value}`,run(d,p){need(d,p.col);const rows=d.rows.filter(r=>testCond(r[p.col],p.op,p.value));return{data:{cols:d.cols,rows},msg:`Kept ${rows.length.toLocaleString()} of ${d.rows.length.toLocaleString()} rows`}}},

  formula:{label:p=>`Add column ${p.name} = ${p.expr}`,run(d,p){const f=compileFormula(p.expr,d.cols);const name=d.cols.includes(p.name)?p.name:uniqName(p.name||'New Column',d.cols);let err=0;const rows=d.rows.map(r=>{let v;try{v=f(r);if(typeof v==='number'&&!isFinite(v))v='';if(typeof v==='boolean')v=v?'TRUE':'FALSE'}catch(e){v='';err++}return {...r,[name]:v??''}});const cols=d.cols.includes(name)?d.cols:[...d.cols,name];return{data:{cols,rows},msg:`Calculated ${name} for ${rows.length.toLocaleString()} rows${err?` (${err} errors left blank)`:''}`}}},

  dateParts:{label:p=>`Extract ${p.parts.join(', ')} from ${p.col}`,run(d,p){need(d,p.col);const cols=[...d.cols];const names={};p.parts.forEach(x=>{names[x]=uniqName(`${p.col} ${{year:'Year',month:'Month',monthName:'Month Name',quarter:'Quarter',weekday:'Weekday',yearMonth:'Year-Month',day:'Day'}[x]}`,cols);cols.push(names[x])});const rows=d.rows.map(r=>{const o={...r};const dt=parseDate(r[p.col])||(isDate(r[p.col])?r[p.col]:null);p.parts.forEach(x=>{o[names[x]]=!dt?'':x==='year'?dt.getFullYear():x==='month'?dt.getMonth()+1:x==='monthName'?MNAME[dt.getMonth()]:x==='quarter'?'Q'+(Math.floor(dt.getMonth()/3)+1):x==='weekday'?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]:x==='day'?dt.getDate():`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`});return o});return{data:{cols,rows},msg:`Added ${p.parts.length} date columns`}}},

function aggregate(vals,agg){

    const g=new Map();for(const r of d.rows){const k=keyOf(r);const ks=k.join('\u0001');if(!g.has(ks))g.set(ks,{k,v:[]});g.get(ks).v.push(val?r[val]:1)}
    const rows=[...g.values()].map(x=>{const o={};rowF.forEach((c,i)=>o[c]=smartVal(x.k[i]));o[vName]=aggregate(x.v,agg);return o});

    return {cols:[...rowF,vName,...(tot!==null&&rowF.length===1?['% Share']:[])],rows:sorted};
  }

}

  if(cmd.op){const r=apply(cmd.op,cmd.params);if(r){S.result={title:'✓ '+OPS[cmd.op].label(cmd.params),q,html:`<p>${esc(r.msg)}. Data now has <b>${S.data.rows.length.toLocaleString()}</b> rows × <b>${S.data.cols.length}</b> columns. This step was recorded — save it as an Automation Agent to repeat it on tomorrow's file.</p>`,preview:true};go('ask')}return}
  if(cmd.nav){Object.assign(S.ui,{['nav_'+cmd.nav]:cmd.params});go(cmd.nav);return}
  if(cmd.view){showView(cmd.view,cmd.params,q)}
}
function showView(v,p,q){
  const d=S.data;let res=null,title='',note='';
  if(v==='pivot'){res=pivot(d,p.rows,p.colField,p.val,p.agg);if(p.top){const vc=res.cols[p.rows.length];res.rows=sortRows(res.rows,vc,p.dir||-1).slice(0,p.top)}title=`${p.agg==='count'?'Count of rows':AGG_LABEL[p.agg]+' of '+p.val} by ${p.rows.join(' & ')}${p.colField?' × '+p.colField:''}${p.top?` — ${p.dir>0?'bottom':'top'} ${p.top}`:''}`}
  if(v==='missing'){res={cols:['Column','Blank cells','% Blank','Filled'],rows:profile().map(x=>({Column:x.col,'Blank cells':x.missing,'% Blank':Math.round(x.missing/Math.max(1,x.count)*1000)/10,Filled:x.filled})).sort((a,b)=>b['Blank cells']-a['Blank cells'])};title='Missing values by column'}
  if(v==='describe'){res=describeTable();title='Column statistics'}
  if(v==='dupes'){const cs=colsArg(d,p.cols);const cnt=new Map();d.rows.forEach(r=>{const k=cs.map(c=>normKey(r[c])).join('\u0001');cnt.set(k,(cnt.get(k)||0)+1)});const dup=d.rows.filter(r=>cnt.get(cs.map(c=>normKey(r[c])).join('\u0001'))>1);res={cols:d.cols,rows:dup};title=`${dup.length.toLocaleString()} rows are part of duplicate groups${p.cols&&p.cols.length?' (by '+cs.join(', ')+')':''}`;note=`<button class="btn pri sm" onclick="apply('dedupe',${esc(JSON.stringify({cols:p.cols||[]}))});go('ask')">Remove duplicates now</button>`}
  if(v==='outliers'){const nums=d.rows.map(r=>toNum(r[p.col])).filter(x=>x!==null).sort((a,b)=>a-b);const q1=quant(nums,.25),q3=quant(nums,.75),k=(q3-q1)*1.5;res={cols:d.cols,rows:d.rows.filter(r=>{const x=toNum(r[p.col]);return x!==null&&(x<q1-k||x>q3+k)})};title=`${res.rows.length} outliers in ${p.col} (outside ${fmtBig(q1-k)} – ${fmtBig(q3+k)})`}
  if(v==='single'){S.result={title:p.label,q,html:`<div class="kpi" style="max-width:320px"><div class="l">${esc(p.label)}</div><div class="v">${esc(fmtCell(p.value))}</div><div class="d">${esc(fmtBig(p.value))}</div></div>`};go('ask');return}
  if(v==='split'){S.ui.nav_export={batch:p.n};go('export');toast(`Set batch size to ${p.n.toLocaleString()} rows — click Download`);return}
  S.result={title,q,data:res,note,chartable:v==='pivot'&&!p.colField};go('ask');
}
function describeTable(){return {cols:['Column','Type','Filled','Blank','Unique','Min','Max','Mean','Median','Sum','Top value'],rows:profile().map(p=>({Column:p.col,Type:p.type,Filled:p.filled,Blank:p.missing,Unique:p.unique,Min:p.min!=null?(isDate(p.min)?iso(p.min):Math.round(p.min*100)/100):'',Max:p.max!=null?(isDate(p.max)?iso(p.max):Math.round(p.max*100)/100):'',Mean:p.mean!=null?Math.round(p.mean*100)/100:'',Median:p.median!=null?Math.round(p.median*100)/100:'',Sum:p.sum!=null?Math.round(p.sum*100)/100:'','Top value':p.top[0]?`${p.top[0][0]} (${p.top[0][1]})`:''}))}}

/* ---------------- time series & forecasting ---------------- */
function periodKey(d,p){const y=d.getFullYear(),m=d.getMonth();if(p==='day')return iso(d);if(p==='week'){const t=new Date(y,m,d.getDate());t.setDate(t.getDate()-((t.getDay()+6)%7));return iso(t)}if(p==='month')return `${y}-${pad(m+1)}`;if(p==='quarter')return `${y}-Q${Math.floor(m/3)+1}`;return String(y)}
function keyDate(k,p){if(p==='day'||p==='week'){const [y,m,d]=k.split('-');return new Date(+y,m-1,+d)}if(p==='month'){const [y,m]=k.split('-');return new Date(+y,m-1,1)}if(p==='quarter'){const [y,q]=k.split('-Q');return new Date(+y,(q-1)*3,1)}return new Date(+k,0,1)}
function nextKey(k,p){const d=keyDate(k,p);if(p==='day')d.setDate(d.getDate()+1);else if(p==='week')d.setDate(d.getDate()+7);else if(p==='month')d.setMonth(d.getMonth()+1);else if(p==='quarter')d.setMonth(d.getMonth()+3);else d.setFullYear(d.getFullYear()+1);return periodKey(d,p)}
function keyLabel(k,p){if(p==='month'){const d=keyDate(k,p);return `${MNAME[d.getMonth()]} ${d.getFullYear()}`}if(p==='week')return 'Wk '+k;return k}
const SEASON={day:7,week:52,month:12,quarter:4,year:0};
function buildSeries(rows,dateCol,valCol,p,agg='sum',filter){
  const g=new Map();
  for(const r of rows){if(filter&&!filter(r))continue;const d=isDate(r[dateCol])?r[dateCol]:parseDate(r[dateCol]);if(!d)continue;const k=periodKey(d,p);if(!g.has(k))g.set(k,[]);g.get(k).push(valCol?r[valCol]:1)}
  if(!g.size)return {keys:[],labels:[],values:[]};
  const sk=[...g.keys()].sort();const keys=[];let k=sk[0];let guard=0;
  while(k<=sk[sk.length-1]&&guard++<5000){keys.push(k);k=nextKey(k,p)}
  const values=keys.map(k=>g.has(k)?aggregate(g.get(k),valCol?agg:'count'):0);
  return {keys,labels:keys.map(k=>keyLabel(k,p)),values};
}
function linFit(y){const n=y.length;let sx=0,sy=0,sxy=0,sxx=0;y.forEach((v,i)=>{sx+=i;sy+=v;sxy+=i*v;sxx+=i*i});const den=n*sxx-sx*sx;const b=den?(n*sxy-sx*sy)/den:0;const a=(sy-b*sx)/n;return {a,b}}
const METHODS={
  linear:{name:'Linear trend',min:3,fit(y,h){const {a,b}=linFit(y);return {fit:y.map((_,i)=>a+b*i),fc:Array.from({length:h},(_,k)=>a+b*(y.length+k))}}},
  ma:{name:'Moving average (3)',min:3,fit(y,h){const k=Math.min(3,y.length);const fit=y.map((v,i)=>i<k?v:mean(y.slice(i-k,i)));const last=mean(y.slice(-k));return {fit,fc:Array(h).fill(last)}}},
  holt:{name:'Holt trend smoothing',min:4,fit(y,h){let best=null;for(let a=.1;a<.95;a+=.1)for(let b=.05;b<.6;b+=.1){let l=y[0],t=y[1]-y[0],sse=0;const fit=[y[0]];for(let i=1;i<y.length;i++){const f=l+t;fit.push(f);sse+=(y[i]-f)**2;const nl=a*y[i]+(1-a)*(l+t);t=b*(nl-l)+(1-b)*t;l=nl}if(!best||sse<best.sse)best={sse,fit,l,t}}return {fit:best.fit,fc:Array.from({length:h},(_,k)=>best.l+(k+1)*best.t)}}},
  hw:{name:'Holt-Winters seasonal',min:null,fit(y,h,m){const n=y.length;let best=null;const s0=mean(y.slice(0,m)),s1=mean(y.slice(m,2*m));
    for(const a of [.1,.3,.5,.7,.9])for(const b of [.01,.1,.3])for(const g of [.1,.3,.5,.7]){let l=s0,t=(s1-s0)/m;const s=y.slice(0,m).map(v=>v-s0);const fit=y.slice(0,m);let sse=0;
      for(let i=m;i<n;i++){const f=l+t+s[i-m];fit.push(f);sse+=(y[i]-f)**2;const nl=a*(y[i]-s[i-m])+(1-a)*(l+t);t=b*(nl-l)+(1-b)*t;s[i]=g*(y[i]-nl)+(1-g)*s[i-m];l=nl}
      if(!best||sse<best.sse)best={sse,fit,l,t,s}}
    return {fit:best.fit,fc:Array.from({length:h},(_,k)=>best.l+(k+1)*best.t+best.s[n-m+(k%m)])}}},
};
function smape(a,f){let s=0,c=0;a.forEach((x,i)=>{const d=(Math.abs(x)+Math.abs(f[i]))/2;if(d>0){s+=Math.abs(x-f[i])/d;c++}});return c?s/c:0}
function forecast(y,h,period,method='auto'){
  const m=SEASON[period]||0;const n=y.length;
  const ok=k=>k==='hw'?(m>1&&n>=2*m+2):n>=METHODS[k].min;
  const cands=(method==='auto'?['hw','holt','linear','ma']:[method]).filter(ok);
  if(!cands.length)return {error:`Need more history — only ${n} ${period}s of data (minimum 3${method==='hw'?`, Holt-Winters needs ${2*m+2}`:''}).`};
  const scores={};
  for(const k of cands){const hd=Math.max(1,Math.min(m||3,Math.floor(n*.2)));const train=y.slice(0,n-hd);if(!(k==='hw'?(train.length>=2*m):train.length>=METHODS[k].min)){scores[k]=null;continue}
    const r=METHODS[k].fit(train,hd,m);scores[k]=smape(y.slice(n-hd),r.fc)}
  const pick=method!=='auto'?method:cands.filter(k=>scores[k]!=null).sort((a,b)=>scores[a]-scores[b])[0]||cands[0];
  const r=METHODS[pick].fit(y,h,m);
  const start=pick==='hw'?m:1;const res=y.slice(start).map((v,i)=>v-r.fit[i+start]);const sd=std(res)||0;
  const nonneg=y.every(v=>v>=0);const cl=v=>nonneg?Math.max(0,v):v;
  return {method:pick,methodName:METHODS[pick].name,scores,acc:scores[pick]!=null?Math.max(0,1-scores[pick]):null,fit:r.fit,fc:r.fc.map(cl),lo:r.fc.map((v,k)=>cl(v-1.96*sd*Math.sqrt(k+1))),hi:r.fc.map((v,k)=>v+1.96*sd*Math.sqrt(k+1))};
}

/* ---------------- insights engine ---------------- */
function corr(a,b){const n=a.length;if(n<5)return 0;const ma=mean(a),mb=mean(b);let s=0,sa=0,sb=0;for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);sa+=(a[i]-ma)**2;sb+=(b[i]-mb)**2}return sa&&sb?s/Math.sqrt(sa*sb):0}
function buildInsights(){
  const d=S.data,P=profile(),out=[],recs=[];const n=d.rows.length;
  const add=(level,icon,title,text)=>out.push({level,icon,title,text});
  const totalCells=n*d.cols.length,blank=sum(P.map(p=>p.missing));
  add('','📋','Dataset overview',`${n.toLocaleString()} rows × ${d.cols.length} columns — ${P.filter(p=>p.type==='number').length} numeric, ${P.filter(p=>p.type==='date').length} date, ${P.filter(p=>p.type==='text').length} text. ${share(1-blank/Math.max(1,totalCells))} of cells are filled.`);
  // duplicates
  const seen=new Set();let dups=0;for(const r of d.rows){const k=d.cols.map(c=>normKey(r[c])).join('\u0001');if(seen.has(k))dups++;else seen.add(k)}
  if(dups){add('warn','⧉','Duplicate rows found',`${dups.toLocaleString()} rows are exact duplicates (${share(dups/n)} of data).`);recs.push({t:`Remove ${dups.toLocaleString()} duplicate rows before reporting — they inflate totals.`,a:"apply('dedupe',{cols:[]})",b:'Remove now'})}
  const miss=P.filter(p=>p.missing/Math.max(1,p.count)>.2&&p.type!=='empty');
  if(miss.length)add('warn','◌','Columns with many blanks',miss.slice(0,5).map(p=>`${p.col} (${share(p.missing/p.count,0)} blank)`).join(', ')+'.');
  const empty=P.filter(p=>p.type==='empty');if(empty.length){add('warn','▢','Empty columns',`${empty.map(p=>p.col).slice(0,6).join(', ')} contain no data.`);recs.push({t:`Delete ${empty.length} empty column(s).`,a:"apply('removeEmptyCols',{})",b:'Delete'})}
  const textNums=P.filter(p=>p.type==='number'&&d.rows.slice(0,500).some(r=>typeof r[p.col]==='string'&&!isBlank(r[p.col])));
  if(textNums.length){add('warn','#','Numbers stored as text',`${textNums.map(p=>p.col).slice(0,5).join(', ')} contain numbers saved as text — formulas and totals may be wrong.`);recs.push({t:'Convert text numbers and dates to real values.',a:"apply('convertTypes',{})",b:'Fix formats'})}
  const ids=P.filter(p=>p.unique===n&&n>10&&p.type!=='number'||(p.unique===n&&/id|no|number|code|iccid|imei/i.test(p.col)));if(ids.length)add('','🔑','Unique identifier columns',`${ids.slice(0,4).map(p=>p.col).join(', ')} — every value is unique, useful as a key for matching / VLOOKUP.`);
  // numeric
  const val=guessValueCol();const nums=P.filter(p=>p.type==='number'&&p.unique>1&&!ids.includes(p)&&!/(^|\W)id$|^id\b|code|pin|phone|mobile|iccid|imei|msisdn|serial|(^|\W)no\.?$/i.test(p.col));
  for(const p of nums.slice(0,4)){
    const sk=p.mean&&p.median?(p.mean-p.median)/(p.std||1):0;
    add('','∑',`${p.col}`,`Total ${fmtBig(p.sum)} · average ${fmtBig(p.mean)} · median ${fmtBig(p.median)} · range ${fmtBig(p.min)} to ${fmtBig(p.max)}.${Math.abs(sk)>.3?` Skewed ${sk>0?'high — a few large values pull the average up':'low'}.`:''}`);
    const k=(p.q3-p.q1)*1.5;const o=d.rows.filter(r=>{const x=toNum(r[p.col]);return x!==null&&(x<p.q1-k||x>p.q3+k)}).length;
    if(o&&o/n<.1&&o>0)add('warn','⚠',`Outliers in ${p.col}`,`${o.toLocaleString()} unusual values ${p.q1-k<=p.min?`above ${fmtBig(p.q3+k)}`:`outside ${fmtBig(p.q1-k)} – ${fmtBig(p.q3+k)}`}. Check for data-entry errors or genuine big deals.`);
  }
  // categories
  const cats=guessCatCols().slice(0,3);
  for(const c of cats){const pv=pivot(d,[c],null,val,val?'sum':'count');const vc=pv.cols[1];const tot=sum(pv.rows.map(r=>r[vc]));if(!tot||pv.rows.length<2)continue;
    const top=pv.rows[0];const sh=top[vc]/tot;let cum=0,k80=0;for(const r of pv.rows){cum+=r[vc];k80++;if(cum/tot>=.8)break}
    add(sh>.4?'warn':'good','◧',`${c}: ${top[c]} leads`,`${top[c]} accounts for ${share(sh)} of ${val||'rows'}${pv.rows[1]?`, followed by ${pv.rows[1][c]} (${share(pv.rows[1][vc]/tot)})`:''}. ${k80} of ${pv.rows.length} ${c} values make up 80% of the total.`);
    if(sh>.4)recs.push({t:`High dependence on ${c} = ${top[c]} (${share(sh)}). Diversify to reduce risk.`});
    else recs.push({t:`Focus effort on the top ${k80} ${c} values — they drive 80% of ${val||'volume'}.`});
  }
  // correlations
  const nc=nums.slice(0,8);const pairs=[];
  for(let i=0;i<nc.length;i++)for(let j=i+1;j<nc.length;j++){const a=[],b=[];for(const r of d.rows.slice(0,20000)){const x=toNum(r[nc[i].col]),y=toNum(r[nc[j].col]);if(x!==null&&y!==null){a.push(x);b.push(y)}}const c=corr(a,b);if(Math.abs(c)>=.6&&Math.abs(c)<.999)pairs.push([nc[i].col,nc[j].col,c])}
  pairs.sort((a,b)=>Math.abs(b[2])-Math.abs(a[2])).slice(0,3).forEach(([a,b,c])=>add('','↗',`${a} ↔ ${b}`,`${c>0?'Move together':'Move in opposite directions'} (correlation ${c.toFixed(2)}). ${c>0?`When ${a} rises, ${b} usually rises too.`:''}`));
  // time trend
  const dc=guessDateCol();
  if(dc&&val){const s=buildSeries(d.rows,dc,val,'month');
    if(s.values.length>=3){const v=s.values,L=v.length;const last=v[L-1],prev=v[L-2];const g=prev?(last-prev)/Math.abs(prev):null;const {b}=linFit(v);const best=v.indexOf(Math.max(...v));
      add(g!=null&&g<-.1?'bad':g>.05?'good':'','📈',`${val} trend by month`,`Latest month ${s.labels[L-1]}: ${fmtBig(last)} (${pct(g)} vs ${s.labels[L-2]}). Best month: ${s.labels[best]} (${fmtBig(v[best])}). Overall trend is ${b>0?'upward ↑':'downward ↓'} at about ${fmtBig(Math.abs(b))} per month.`);
      if(L>=13){const yoy=v[L-13]?(last-v[L-13])/Math.abs(v[L-13]):null;if(yoy!=null)add(yoy>=0?'good':'bad','📅','Year-over-year',`${s.labels[L-1]} is ${pct(yoy)} vs ${s.labels[L-13]}.`)}
      if(L>=12){const mo=Array(12).fill(0).map(()=>[]);s.keys.forEach((k,i)=>mo[keyDate(k,'month').getMonth()].push(v[i]));const avg=mo.map(a=>a.length?mean(a):0);const pk=avg.indexOf(Math.max(...avg)),lw=avg.indexOf(Math.min(...avg));add('','🗓','Seasonality',`${MNAME[pk]} is typically the strongest month and ${MNAME[lw]} the weakest.`);recs.push({t:`Plan stock, staffing and campaigns ahead of ${MNAME[pk]} (peak) and run promotions in ${MNAME[lw]} (low).`})}
      if(g!=null&&g<-.1)recs.push({t:`${val} dropped ${pct(g)} in ${s.labels[L-1]}. Review which ${cats[0]||'segments'} declined in Revenue & Planning.`});
      recs.push({t:`Run a forecast for ${val} to plan the next 6 months.`,a:"go('forecast')",b:'Open forecast'});
    }}
  return {items:out,recs};
}

/* ---------------- big-data safe Excel writer (splits across sheets) ---------------- */
const SHEET_LIMIT={xlsx:1000000,xls:65000,ods:1000000};
function arrBook(cols,n,getRow,fmt){
  const lim=SHEET_LIMIT[fmt]||1000000;
  const sample={cols,rows:[]};for(let i=0;i<Math.min(n,4000);i++){const r=getRow(i),o={};cols.forEach((c,j)=>o[c]=r[j]);sample.rows.push(o)}
  const kinds=colKinds(sample);const fm=kinds.map(k=>{const f=numFmtFor(k.kind);return f&&f.includes('[>=')?(k.kind==='int'?'#,##0':'#,##0.00'):f});
  const wb=XLSX.utils.book_new();const parts=Math.max(1,Math.ceil(n/lim));
  for(let s=0;s<parts;s++){
    const from=s*lim,to=Math.min(n,from+lim);const aoa=new Array(to-from+1);aoa[0]=cols;
    for(let i=from;i<to;i++){const r=getRow(i);const o=new Array(cols.length);for(let j=0;j<cols.length;j++){const v=normVal(r[j],kinds[j].kind);o[j]=v===null?'':isDate(v)?xlSerial(v):v}aoa[i-from+1]=o}
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    kinds.forEach((k,j)=>{const f=fm[j];if(!f||k.kind==='text')return;for(let i=1;i<aoa.length;i++){const c=ws[XLSX.utils.encode_cell({r:i,c:j})];if(!c)continue;if(k.kind==='id'){c.t='s';c.z='@'}else if(c.t==='n')c.z=f}});
    ws['!cols']=cols.map((c,j)=>({wch:Math.min(45,Math.max(10,String(c).length+2,kinds[j].kind==='id'?24:0,['date','datetime'].includes(kinds[j].kind)?12:0))}));
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:0,c:Math.max(0,cols.length-1)}})};
    XLSX.utils.book_append_sheet(wb,ws,parts>1?`Data ${s+1}`:'Data');
  }
  return new Blob([XLSX.write(wb,{bookType:fmt==='xls'?'biff8':fmt==='ods'?'ods':'xlsx',type:'array',compression:true})]);
}

async function* iterBuf(name,buf,label){
  const {ext,kind}=sniff(name,buf);
  if(kind==='zip'){

function splitHeader(aoa){
  const counts=aoa.slice(0,15).map(r=>Array.isArray(r)?r.filter(x=>!isBlank(x)).length:0);let mx=0;for(const c of counts)if(c>mx)mx=c;
  let h=counts.findIndex(c=>c>=Math.max(1,Math.ceil(mx*.6)));if(h<0)h=0;
  let width=0;for(let i=h;i<aoa.length;i++){const l=aoa[i]?.length||0;if(l>width)width=l}
  const cols=[];for(let i=0;i<width;i++){let n=aoa[h]?.[i];n=isBlank(n)?`Column_${i+1}`:isDate(n)?iso(n):String(n).replace(/\s+/g,' ').trim();cols.push(uniqName(n,cols))}

async function quickMerge(files,opt,onProg){
  const t0=performance.now();const master=[],keyIdx=new Map();const nk=c=>{const k=opt.loose?String(c).toLowerCase().replace(/[^a-z0-9]/g,''):String(c);return k||String(c)};
  const csvParts=[],rowsAll=[],report=[];let total=0,dups=0,blank=0,firstFmt=null;const seen=opt.dedupe?new Set():null;
  const fmtFor=()=>opt.fmt==='same'?(firstFmt||'csv'):opt.fmt;
  const tick=()=>new Promise(r=>setTimeout(r,0));
  for(const f of files){
    onProg({msg:`Opening ${f.name}…`});await tick();
    let buf=await f.arrayBuffer();
    for await(const t of iterBuf(f.name,buf,f.name)){
      if(!firstFmt)firstFmt=EXT_OUT[t.ext]||'csv';
      const fmt=fmtFor();const toText=['csv','tsv'].includes(fmt);
      const {cols,start}=splitHeader(t.aoa);
      const map=cols.map(c=>{const k=nk(c);if(!keyIdx.has(k)){keyIdx.set(k,master.length);master.push(c)}return keyIdx.get(k)});
      let src=-1;if(opt.source){if(!keyIdx.has('\u0000src')){keyIdx.set('\u0000src',master.length);master.push('Source File')}src=keyIdx.get('\u0000src')}
      const out=[];let n=0;
      for(let i=start;i<t.aoa.length;i++){const r=t.aoa[i];if(!r||!r.some(x=>!isBlank(x))){blank++;continue}
        const row=new Array(master.length).fill('');for(let j=0;j<map.length;j++){let v=r[j];if(v===undefined||v===null)v='';row[map[j]]=t.text&&!toText?smartVal(v):v}
        if(src>=0)row[src]=t.label;
        if(seen){const k=row.map(normKey).join('\u0001');if(seen.has(k)){dups++;continue}seen.add(k)}
        out.push(row);n++}
      t.aoa=null;
      if(toText){csvParts.push(Papa.unparse(out.map(r=>r.map(csvCell)),{delimiter:fmt==='tsv'?'\t':',',newline:'\r\n'})+'\r\n')}
      else for(const r of out)rowsAll.push(r);
      report.push({label:t.label,format:t.real.toUpperCase(),rows:n,cols:cols.length});total+=n;
      onProg({msg:`✓ ${t.label} — ${n.toLocaleString(LOC())} rows`,total,report});await tick();
    }
    buf=null;
  }
  if(!report.length)throw new Error('No readable data found in the files');
  const fmt=fmtFor();onProg({msg:`Writing .${fmt} file (${total.toLocaleString(LOC())} rows)…`,total,report});await tick();
  let blob;
  if(['csv','tsv'].includes(fmt)){const head=Papa.unparse([master],{delimiter:fmt==='tsv'?'\t':',',newline:'\r\n'})+'\r\n';blob=new Blob(['﻿',head,...csvParts],{type:'text/csv'})}
  else if(fmt==='xlsx'&&total<=150000){const rows=rowsAll.map(r=>{const o={};master.forEach((c,j)=>o[c]=r[j]??'');return o});blob=await fileBytes({cols:master,rows},'xlsx')}
  else if(fmt==='json'){const rows=rowsAll.map(r=>{const o={};master.forEach((c,j)=>o[c]=csvCell(r[j]??''));return o});blob=new Blob([JSON.stringify(rows)],{type:'application/json'})}
  else if(fmt==='xls'&&total>300000){const z=new JSZip();const per=SHEET_LIMIT.xls;const parts=Math.ceil(total/per);
    for(let p=0;p<parts;p++){onProg({msg:`Writing part ${p+1} of ${parts}…`,total,report});await tick();const off=p*per;z.file(`part${String(p+1).padStart(2,'0')}.xls`,arrBook(master,Math.min(per,total-off),i=>rowsAll[off+i],'xls'))}
    blob=await z.generateAsync({type:'blob',compression:'STORE'});return {blob,fmt:'zip',xlsParts:parts,cols:master,total,dups,blank,report,sheets:parts,secs:(performance.now()-t0)/1000,rowsAll,name:report.length>1?`merged_${report.length}_files_xls`:'merged_xls'}}

  return {blob,fmt,cols:master,total,dups,blank,report,sheets,secs:(performance.now()-t0)/1000,rowsAll:fmt==='csv'||fmt==='tsv'?null:rowsAll,name:report.length>1?`merged_${report.length}_files`:report[0].label.split(/[›\/]/).pop().trim().replace(/\.[^.]+$/,'')};
}

VIEWS.charts={html(){

  const ui=S.ui.ch||(S.ui.ch={type:'bar',x:guessDateCol()||guessCatCols()[0]||S.data.cols[0],y:guessValueCol()||'',agg:guessValueCol()?'sum':'count',period:'month',top:15,series:''});

},after(){
  const ui=S.ui.ch;const run=()=>{Object.assign(ui,{type:$('#chT').value,x:$('#chX').value,y:$('#chY').value,agg:$('#chA').value,series:$('#chS').value,period:$('#chP').value,top:+$('#chN').value||15});if(!ui.y)ui.agg='count';drawMain()};
  ['chT','chX','chY','chA','chS','chP','chN'].forEach(id=>$('#'+id).onchange=run);drawMain();
}};
function drawMain(){
  const ui=S.ui.ch,d=S.data;const isD=typeOf(ui.x)==='date';const vlab=ui.y?`${AGG_LABEL[ui.agg]} of ${ui.y}`:'Count';
  $('#chTitle').textContent=`${vlab} by ${ui.x}${ui.series?' split by '+ui.series:''}`;$('#chLegend').innerHTML='';
  if(ui.type==='scatter'){const pts=d.rows.slice(0,5000).map(r=>({x:toNum(r[ui.x]),y:toNum(r[ui.y])})).filter(p=>p.x!==null&&p.y!==null);
    mkChart('mainChart',{type:'scatter',data:{datasets:[{label:`${ui.y} vs ${ui.x}`,data:pts,backgroundColor:PAL[0]+'aa',pointRadius:4,pointHoverRadius:6}]},options:baseOpts(true,{interaction:{mode:'nearest',intersect:true},scales:{x:{title:{display:true,text:ui.x},ticks:{callback:v=>fmtBig(v,1)}},y:{title:{display:true,text:ui.y},ticks:{callback:v=>fmtBig(v,1)}}}})});return}
  let labels,datasets;const single=!ui.series;
  if(isD){
    const seriesVals=ui.series?pivot(d,[ui.series],null,ui.y||null,ui.y?'sum':'count').rows.slice(0,7).map(r=>fmtCell(r[ui.series])):[null];
    const base=buildSeries(d.rows,ui.x,ui.y||null,ui.period,ui.agg);labels=base.labels;
    datasets=seriesVals.map((sv,i)=>{const s=sv===null?base:buildSeries(d.rows,ui.x,ui.y||null,ui.period,ui.agg,r=>fmtCell(r[ui.series])===sv);const map=new Map(s.keys.map((k,j)=>[k,s.values[j]]));return {label:sv??vlab,data:base.keys.map(k=>map.get(k)??0)}});
  }else{
    if(ui.series){const p=pivot(d,[ui.x],ui.series,ui.y||null,ui.agg);const top=p.rows.slice(0,ui.top);const scols=p.cols.slice(1,-1);const tot=scols.map(c=>[c,sum(top.map(r=>r[c]))]).sort((a,b)=>b[1]-a[1]);const keep=tot.slice(0,7).map(x=>x[0]);labels=top.map(r=>fmtCell(r[ui.x]));datasets=keep.map(c=>({label:c,data:top.map(r=>r[c])}));if(tot.length>7)datasets.push({label:'Other',data:top.map(r=>sum(tot.slice(7).map(([c])=>r[c]||0)))})}
    else{const p=pivot(d,[ui.x],null,ui.y||null,ui.agg);let rows=p.rows;const vc=p.cols[1];
      if(['pie','doughnut'].includes(ui.type)&&rows.length>8){const other=sum(rows.slice(7).map(r=>r[vc]));rows=rows.slice(0,7).concat([{[ui.x]:'Other',[vc]:other}])}else rows=rows.slice(0,ui.top);
      if(typeOf(ui.x)==='number')rows=sortRows(rows,ui.x,1);labels=rows.map(r=>fmtCell(r[ui.x]));datasets=[{label:vlab,data:rows.map(r=>r[vc])}]}
  }
  const t=ui.type;const pie=['pie','doughnut'].includes(t);
  datasets.forEach((ds,i)=>{const c=ds.label==='Other'?'#9aa3b2':PAL[i%8];if(pie){ds.backgroundColor=labels.map((l,j)=>l==='Other'?'#9aa3b2':PAL[j%8]);ds.borderColor='#fff';ds.borderWidth=2}else if(t==='line'||t==='area'){Object.assign(ds,{borderColor:c,backgroundColor:t==='area'?c+'33':c,fill:t==='area',borderWidth:2,tension:.25,pointRadius:labels.length>40?0:3,pointHoverRadius:5})}else Object.assign(ds,{backgroundColor:c,borderRadius:4,maxBarThickness:46,borderSkipped:'start'})});
  const cfg={type:pie?t:t==='hbar'?'bar':t==='area'?'line':t,data:{labels,datasets},options:pie?{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,boxHeight:10}},tooltip:{callbacks:{label:c=>{const tot=sum(c.dataset.data);return `${c.label}: ${c.parsed.toLocaleString('en-IN',{maximumFractionDigits:2})} (${share(c.parsed/tot)})`}}}}}:baseOpts(single,t==='hbar'?{indexAxis:'y',scales:{y:{grid:{display:false}},x:{beginAtZero:true,ticks:{callback:v=>fmtBig(v,1)}}}}:{})};
  mkChart('mainChart',cfg);
}
function downloadChart(id,name){const c=S.charts[id];if(!c)return;const cv=c.canvas;const tmp=document.createElement('canvas');tmp.width=cv.width;tmp.height=cv.height;const x=tmp.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,tmp.width,tmp.height);x.drawImage(cv,0,0);tmp.toBlob(b=>saveBlob(name+'.png',b),'image/png')}

VIEWS.forecast={html(){
  const n=S.ui.nav_forecast;delete S.ui.nav_forecast;const dates=colsOfType('date');
  const ui=S.ui.fc||(S.ui.fc={date:guessDateCol(),val:guessValueCol(),period:'month',h:6,method:'auto',agg:'sum',seg:'',segv:''});

  if(!dates.length)return `<h1>Forecast</h1><div class="card empty-state"><div class="e">📅</div><h2>No date column found</h2><p>Forecasting needs a column with dates. If your dates are stored as text, convert them in Clean → Dates, or run Auto Clean.</p><button class="btn pri" onclick="apply('autoClean',{...AUTO_DEFAULT})">Run Auto Clean</button></div>`;
  return `<h1>Forecast</h1><p class="sub">Predict future values from history. The best method is chosen automatically by testing each one on your most recent data.</p>

   <label class="f">Value to forecast<select class="i" id="fcV">${colOpts(ui.val,'— count rows —')}</select></label>
   <label class="f">Period<select class="i" id="fcP">${['day','week','month','quarter','year'].map(p=>`<option${p===ui.period?' selected':''}>${p}</option>`).join('')}</select></label>
   <label class="f">Periods ahead<input class="i" id="fcH" type="number" min="1" max="60" value="${ui.h}"></label>
   <label class="f">Method<select class="i" id="fcM">${[['auto','Auto (best accuracy)'],['hw','Holt-Winters (seasonal)'],['holt','Holt (trend)'],['linear','Linear trend'],['ma','Moving average']].map(([k,v])=>`<option value="${k}"${k===ui.method?' selected':''}>${v}</option>`).join('')}</select></label>
   <label class="f">Calculation<select class="i" id="fcA"><option value="sum"${ui.agg==='sum'?' selected':''}>Sum per period</option><option value="avg"${ui.agg==='avg'?' selected':''}>Average per period</option><option value="count"${ui.agg==='count'?' selected':''}>Count per period</option></select></label>
   <label class="f">Segment (optional)<select class="i" id="fcS">${colOpts(ui.seg,'— all data —')}</select></label>
   <label class="f">Segment value<select class="i" id="fcSV"></select></label></div></div>
  <div id="fcOut"></div>`;
},after(){
  const ui=S.ui.fc;if(!$('#fcD'))return;
  const fillSeg=()=>{const s=$('#fcS').value;$('#fcSV').innerHTML=s?opt(pivot(S.data,[s],null,null,'count').rows.slice(0,100).map(r=>fmtCell(r[s])),ui.segv):'<option value="">—</option>'};
  const run=()=>{Object.assign(ui,{date:$('#fcD').value,val:$('#fcV').value,period:$('#fcP').value,h:Math.max(1,Math.min(60,+$('#fcH').value||6)),method:$('#fcM').value,agg:$('#fcA').value,seg:$('#fcS').value,segv:$('#fcSV').value});runForecast()};
  $('#fcS').onchange=()=>{fillSeg();run()};fillSeg();['fcD','fcV','fcP','fcH','fcM','fcA','fcSV'].forEach(id=>$('#'+id).onchange=run);run();
}};
function runForecast(){
  const ui=S.ui.fc;const filt=ui.seg&&ui.segv?r=>fmtCell(r[ui.seg])===ui.segv:null;
  const s=buildSeries(S.data.rows,ui.date,ui.val||null,ui.period,ui.val?ui.agg:'count',filt);
  let dropped='';if(s.values.length>4&&['month','quarter'].includes(ui.period)){let maxD=0;for(const r of S.data.rows){const d=isDate(r[ui.date])?r[ui.date]:parseDate(r[ui.date]);if(d&&+d>maxD)maxD=+d}const end=keyDate(nextKey(s.keys[s.keys.length-1],ui.period),ui.period);if(maxD&&(+end-maxD)>864e5*(ui.period==='month'?7:20)){dropped=s.labels.pop();s.keys.pop();s.values.pop()}}
  const f=forecast(s.values,ui.h,ui.period,ui.method);const out=$('#fcOut');
  if(f.error){out.innerHTML=`<div class="card"><p class="pill warn">${esc(f.error)}</p></div>`;return}
  const fk=[];let k=s.keys[s.keys.length-1];for(let i=0;i<ui.h;i++){k=nextKey(k,ui.period);fk.push(k)}
  const fl=fk.map(x=>keyLabel(x,ui.period));const tot=sum(f.fc);const prevTot=sum(s.values.slice(-ui.h));const g=prevTot?(tot-prevTot)/Math.abs(prevTot):null;
  const tbl={cols:['Period','Forecast','Low (95%)','High (95%)'],rows:fl.map((l,i)=>({Period:l,Forecast:Math.round(f.fc[i]*100)/100,'Low (95%)':Math.round(f.lo[i]*100)/100,'High (95%)':Math.round(f.hi[i]*100)/100}))};
  S.fcResult={tbl,hist:{cols:['Period','Actual','Model fit'],rows:s.labels.map((l,i)=>({Period:l,Actual:s.values[i],'Model fit':Math.round(f.fit[i]*100)/100}))},f,s,fl};
  const vname=ui.val||'Rows';
  out.innerHTML=`<div class="grid g4" style="margin-bottom:16px">
   <div class="kpi"><div class="l">Forecast total (next ${ui.h} ${ui.period}s)</div><div class="v">${fmtBig(tot)}</div><div class="d ${g>=0?'up':'down'}">${pct(g)} vs previous ${ui.h} ${ui.period}s</div></div>
   <div class="kpi"><div class="l">Next ${ui.period}</div><div class="v">${fmtBig(f.fc[0])}</div><div class="d">range ${fmtBig(f.lo[0])} – ${fmtBig(f.hi[0])}</div></div>
   <div class="kpi"><div class="l">Method chosen</div><div class="v" style="font-size:17px">${esc(f.methodName)}</div><div class="d">${Object.entries(f.scores).filter(x=>x[1]!=null).map(([m,v])=>`${METHODS[m].name.split(' ')[0]} ${share(Math.max(0,1-v),0)}`).join(' · ')}</div></div>
   <div class="kpi"><div class="l">Backtest accuracy</div><div class="v">${f.acc!=null?share(f.acc,0):'—'}</div><div class="d">${dropped?`${esc(dropped)} skipped (incomplete) · `:''}tested on last ${Math.max(1,Math.min(SEASON[ui.period]||3,Math.floor(s.values.length*.2)))} ${ui.period}s · ${s.values.length} ${ui.period}s of history</div></div></div>
  <div class="card"><div class="res-head"><h2 style="margin:0">${esc(vname)} — actual vs forecast${ui.seg&&ui.segv?` (${esc(ui.seg)} = ${esc(ui.segv)})`:''}</h2><div class="row"><button class="btn sm" onclick="downloadChart('fcChart','forecast_chart')">⬇ PNG</button><button class="btn sm" onclick="saveBlob('forecast.xlsx',workbookBlob([['Forecast',S.fcResult.tbl],['History',S.fcResult.hist]]))">⬇ Excel</button></div></div>
   <div class="chartbox" style="height:380px"><canvas id="fcChart"></canvas></div>
   <div class="legend"><span><i style="background:${PAL[0]}"></i>Actual</span><span><i style="background:${PAL[1]}"></i>Forecast</span><span><i style="background:${PAL[1]}33"></i>95% range</span></div></div>
  <div class="grid g2"><div class="card"><h2>Forecast table</h2><div class="tw">${tableHTML(tbl,{limit:100})}</div></div>
  <div class="card"><h2>What this means</h2><div class="ins ${g>=0?'good':'bad'}"><div class="ic">${g>=0?'↗':'↘'}</div><div><b>Expected ${g>=0?'growth':'decline'}</b><p>Over the next ${ui.h} ${ui.period}s, ${esc(vname)} is expected to total about ${fmtBig(tot)}, ${pct(g)} compared with the last ${ui.h} ${ui.period}s (${fmtBig(prevTot)}).</p></div></div>
   <div class="ins"><div class="ic">±</div><div><b>Uncertainty</b><p>There is a 95% chance each ${ui.period} lands between the low and high values. The range widens further out — re-run the forecast as new data arrives.</p></div></div>
   <div class="ins"><div class="ic">⚙</div><div><b>Why ${esc(f.methodName)}?</b><p>${f.method==='hw'?'Your data has a repeating seasonal pattern, so the model captures both trend and seasonality.':f.method==='holt'?'The data shows a trend that changes over time; Holt smoothing follows it closely.':f.method==='linear'?'A straight-line trend fitted the recent history best.':'History is flat or noisy, so the recent average is the most reliable guide.'} It had the lowest error when tested on recent data.</p></div></div>
   <button class="btn" onclick="go('revenue')">Use in Revenue & Planning →</button></div></div>`;
  const N=s.labels.length;const labels=[...s.labels,...fl];const pad0=Array(N-1).fill(null);
  mkChart('fcChart',{type:'line',data:{labels,datasets:[
    {label:'Actual',data:[...s.values,...Array(ui.h).fill(null)],borderColor:PAL[0],backgroundColor:PAL[0],borderWidth:2,pointRadius:N>60?0:2,tension:.2},
    {label:'Forecast',data:[...pad0,s.values[N-1],...f.fc],borderColor:PAL[1],backgroundColor:PAL[1],borderWidth:2,borderDash:[6,4],pointRadius:2,tension:.2},
    {label:'High',data:[...pad0,s.values[N-1],...f.hi],borderColor:'transparent',backgroundColor:PAL[1]+'26',fill:'+1',pointRadius:0},
    {label:'Low',data:[...pad0,s.values[N-1],...f.lo],borderColor:'transparent',backgroundColor:'transparent',fill:false,pointRadius:0}]},
    options:baseOpts(true,{plugins:{legend:{display:false},tooltip:{backgroundColor:'#1c2230',filter:i=>i.raw!=null,callbacks:{label:c=>`${c.dataset.label}: ${fmtBig(c.parsed.y)}`}}}})});
}

VIEWS.revenue={html(){
  const dates=colsOfType('date'),nums=colsOfType('number');
  const ui=S.ui.rv||(S.ui.rv={rev:guessValueCol(),cost:nums.find(c=>/cost|expense|cogs|purchase/i.test(c))||'',date:guessDateCol(),cat:guessCatCols()[0]||'',period:'month',growth:10,h:6});
  if(!nums.length)return `<h1>Revenue & Planning</h1><div class="card empty-state"><div class="e">₹</div><h2>No numeric column found</h2><p>Run Auto Clean to convert numbers stored as text.</p></div>`;
  return `<h1>Revenue & Planning</h1><p class="sub">Understand where revenue comes from, how it is trending, and build a target plan with best / base / worst scenarios.</p>
  <div class="card"><div class="grid g4">
   <label class="f">Revenue column<select class="i" id="rvR">${opt(nums,ui.rev)}</select></label>
   <label class="f">Cost column (optional)<select class="i" id="rvC">${opt(nums,ui.cost,'— none —')}</select></label>
   <label class="f">Date column<select class="i" id="rvD">${opt(dates,ui.date,'— none —')}</select></label>
   <label class="f">Breakdown by<select class="i" id="rvK">${colOpts(ui.cat,'— none —')}</select></label>
   <label class="f">Period<select class="i" id="rvP">${['week','month','quarter'].map(p=>`<option${p===ui.period?' selected':''}>${p}</option>`).join('')}</select></label>
   <label class="f">Target growth vs forecast (%)<input class="i" id="rvG" type="number" value="${ui.growth}"></label>
   <label class="f">Plan horizon (periods)<input class="i" id="rvH" type="number" min="1" max="24" value="${ui.h}"></label>
   <div style="display:flex;align-items:end"><button class="btn pri" onclick="downloadPlan()">⬇ Download plan (Excel)</button></div></div></div>
  <div id="rvOut"></div>`;
},after(){
  if(!$('#rvR'))return;const ui=S.ui.rv;
  const run=()=>{Object.assign(ui,{rev:$('#rvR').value,cost:$('#rvC').value,date:$('#rvD').value,cat:$('#rvK').value,period:$('#rvP').value,growth:+$('#rvG').value||0,h:Math.max(1,Math.min(24,+$('#rvH').value||6))});runRevenue()};
  ['rvR','rvC','rvD','rvK','rvP','rvG','rvH'].forEach(id=>$('#'+id).onchange=run);run();
}};
function runRevenue(){
  const ui=S.ui.rv,d=S.data;const R=d.rows.map(r=>toNum(r[ui.rev])).filter(x=>x!==null);const total=sum(R);
  const C=ui.cost?sum(d.rows.map(r=>toNum(r[ui.cost])||0)):null;const profit=C!=null?total-C:null;
  let kp=`<div class="kpi"><div class="l">Total ${esc(ui.rev)}</div><div class="v">${fmtBig(total)}</div><div class="d">${R.length.toLocaleString()} records · avg ${fmtBig(mean(R))} per record</div></div>`;
  if(C!=null)kp+=`<div class="kpi"><div class="l">Profit</div><div class="v">${fmtBig(profit)}</div><div class="d">margin ${share(profit/total)} · cost ${fmtBig(C)}</div></div>`;
  let s=null,trend='',plan=null,recs=[];
  if(ui.date){
    s=buildSeries(d.rows,ui.date,ui.rev,ui.period);const v=s.values,L=v.length;
    if(L>=2){const g=v[L-2]?(v[L-1]-v[L-2])/Math.abs(v[L-2]):null;const best=v.indexOf(Math.max(...v));
      kp+=`<div class="kpi"><div class="l">Latest ${ui.period} (${esc(s.labels[L-1])})</div><div class="v">${fmtBig(v[L-1])}</div><div class="d ${g>=0?'up':'down'}">${pct(g)} vs ${esc(s.labels[L-2])}</div></div><div class="kpi"><div class="l">Best ${ui.period}</div><div class="v">${fmtBig(v[best])}</div><div class="d">${esc(s.labels[best])} · avg ${fmtBig(mean(v))}/${ui.period}</div></div>`;
      if(g!=null&&g<-.1)recs.push(['bad',`${ui.rev} fell ${pct(g)} in the latest ${ui.period}. Check the declining segments below and act quickly.`]);
      else if(g!=null&&g>.1)recs.push(['good',`Strong momentum: ${pct(g)} growth in the latest ${ui.period}. Identify what drove it and repeat it.`]);
      if(L>=SEASON[ui.period]+1&&SEASON[ui.period]){const yo=v[L-1-SEASON[ui.period]];if(yo)recs.push([v[L-1]>=yo?'good':'warn',`Compared to the same ${ui.period} last year: ${pct((v[L-1]-yo)/Math.abs(yo))}.`])}
    }
    const f=forecast(v,ui.h,ui.period,'auto');
    if(!f.error){const fk=[];let k=s.keys[L-1];for(let i=0;i<ui.h;i++){k=nextKey(k,ui.period);fk.push(keyLabel(k,ui.period))}
      const runRate=mean(v.slice(-Math.min(3,L)));
      plan={cols:['Period','Worst case','Base forecast','Best case',`Target (+${ui.growth}%)`,'Gap to target','Target vs recent run-rate'],rows:fk.map((l,i)=>{const base=f.fc[i],tg=base*(1+ui.growth/100);return {Period:l,'Worst case':Math.round(f.lo[i]),'Base forecast':Math.round(base),'Best case':Math.round(f.hi[i]),[`Target (+${ui.growth}%)`]:Math.round(tg),'Gap to target':Math.round(tg-base),'Target vs recent run-rate':runRate?Math.round((tg/runRate-1)*1000)/10+'%':''}})};
      const tgT=sum(plan.rows.map(r=>r[`Target (+${ui.growth}%)`])),bT=sum(f.fc);
      plan.rows.push({Period:'TOTAL','Worst case':Math.round(sum(f.lo)),'Base forecast':Math.round(bT),'Best case':Math.round(sum(f.hi)),[`Target (+${ui.growth}%)`]:Math.round(tgT),'Gap to target':Math.round(tgT-bT),'Target vs recent run-rate':''});
      recs.push(['',`To hit the target of ${fmtBig(tgT)} over the next ${ui.h} ${ui.period}s you need ${fmtBig((tgT-bT)/ui.h)} extra per ${ui.period} above the base forecast (${fmtBig(bT)}). Forecast method: ${f.methodName}${f.acc!=null?`, ~${share(f.acc,0)} backtest accuracy`:''}.`]);
      S.rvF={f,fk};
    }
  }
  let catHtml='';S.rvCat=null;
  if(ui.cat){
    const p=pivot(d,[ui.cat],null,ui.rev,'sum');const vc=p.cols[1];let cum=0;
    let growthMap=null;
    if(s&&s.keys.length>=2){const lk=s.keys[s.keys.length-1],pk=s.keys[s.keys.length-2];growthMap=new Map();for(const r of d.rows){const dt=isDate(r[ui.date])?r[ui.date]:parseDate(r[ui.date]);if(!dt)continue;const k=periodKey(dt,ui.period);if(k!==lk&&k!==pk)continue;const c=fmtCell(r[ui.cat])||'(blank)';if(!growthMap.has(c))growthMap.set(c,[0,0]);growthMap.get(c)[k===lk?1:0]+=toNum(r[ui.rev])||0}}
    let costMap=null;if(ui.cost){costMap=new Map(pivot(d,[ui.cat],null,ui.cost,'sum').rows.map(r=>[fmtCell(r[ui.cat]),r[`Sum of ${ui.cost}`]]))}
    const rows=p.rows.map(r=>{cum+=r[vc];const name=fmtCell(r[ui.cat]);const o={[ui.cat]:r[ui.cat],[ui.rev]:r[vc],'Share %':Math.round(r[vc]/total*1000)/10,'Cumulative %':Math.round(cum/total*1000)/10};
      if(costMap){const c=costMap.get(name)||0;o['Profit']=Math.round(r[vc]-c);o['Margin %']=r[vc]?Math.round((r[vc]-c)/r[vc]*1000)/10:''}
      if(growthMap){const g=growthMap.get(name);o['Last vs prev period %']=g&&g[0]?Math.round((g[1]-g[0])/Math.abs(g[0])*1000)/10:''}
      o['Class']=(cum-r[vc])/total<.8?'A — core':(cum-r[vc])/total<.95?'B — growth':'C — long tail';return o});
    S.rvCat={cols:Object.keys(rows[0]||{}),rows};
    const nA=rows.filter(r=>r.Class.startsWith('A')).length;
    recs.push(['',`${nA} of ${rows.length} ${ui.cat} values (class A) generate 80% of ${ui.rev}. Protect and prioritise these first.`]);
    if(rows[0]&&rows[0]['Share %']>40)recs.push(['warn',`Concentration risk: ${fmtCell(rows[0][ui.cat])} alone is ${rows[0]['Share %']}% of ${ui.rev}.`]);
    if(growthMap){const dec=rows.filter(r=>typeof r['Last vs prev period %']==='number'&&r['Last vs prev period %']<-15&&r['Share %']>=3).slice(0,3);const inc=rows.filter(r=>typeof r['Last vs prev period %']==='number'&&r['Last vs prev period %']>15&&r['Share %']>=3).slice(0,3);
      if(dec.length)recs.push(['bad',`Declining: ${dec.map(r=>`${fmtCell(r[ui.cat])} (${r['Last vs prev period %']}%)`).join(', ')}. Investigate pricing, supply or customer issues.`]);
      if(inc.length)recs.push(['good',`Growing: ${inc.map(r=>`${fmtCell(r[ui.cat])} (+${r['Last vs prev period %']}%)`).join(', ')}. Consider more investment / stock here.`])}
    if(costMap){const low=rows.filter(r=>typeof r['Margin %']==='number'&&r['Share %']>=2).sort((a,b)=>a['Margin %']-b['Margin %'])[0];if(low)recs.push(['warn',`Lowest margin: ${fmtCell(low[ui.cat])} at ${low['Margin %']}%. Review costs or pricing.`])}
    catHtml=`<div class="card"><div class="res-head"><h2 style="margin:0">${esc(ui.rev)} by ${esc(ui.cat)} — ABC analysis</h2><button class="btn sm" onclick="exportData(S.rvCat,'revenue_by_${esc(ui.cat).replace(/\W+/g,'_')}','${S.srcFormat}')">⬇ Download</button></div><div class="chartbox sm" style="margin-bottom:12px"><canvas id="rvCatC"></canvas></div><div class="tw">${tableHTML(S.rvCat,{limit:300})}</div></div>`;
  }
  S.rvPlan=plan;
  $('#rvOut').innerHTML=`<div class="grid g4" style="margin-bottom:16px">${kp}</div>
   ${s?`<div class="card"><h2>${esc(ui.rev)} trend & plan</h2><div class="chartbox"><canvas id="rvT"></canvas></div><div class="legend"><span><i style="background:${PAL[0]}"></i>Actual</span>${C!=null?`<span><i style="background:${PAL[2]}"></i>Profit</span>`:''}${plan?`<span><i style="background:${PAL[1]}"></i>Base forecast</span><span><i style="background:${PAL[6]}"></i>Target</span>`:''}</div></div>`:''}
   <div class="grid g2">${plan?`<div class="card"><h2>📋 Plan — next ${ui.h} ${ui.period}s</h2><div class="tw">${tableHTML(plan,{limit:50})}</div></div>`:''}
   <div class="card"><h2>🎯 Decisions & recommendations</h2>${recs.map(([l,t])=>`<div class="ins ${l}"><div class="ic">${l==='bad'?'!':l==='warn'?'⚠':l==='good'?'✓':'→'}</div><div><p style="color:var(--ink)">${esc(t)}</p></div></div>`).join('')||'<p class="muted">Choose a date and breakdown column for recommendations.</p>'}</div></div>${catHtml}`;
  if(s){const ds=[{label:'Actual',data:[...s.values,...(plan?Array(ui.h).fill(null):[])],borderColor:PAL[0],backgroundColor:PAL[0],borderWidth:2,tension:.2,pointRadius:2}];
