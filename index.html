function dashPDF(dash,art){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const W=297,H=210,M=10;const t=theme();const head=hexRgb(t.head),tint=hexRgb(t.tint);
  const header=()=>{doc.setFillColor(...head);doc.rect(0,0,W,20,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(pdfT(dash.title),M,11);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(pdfT(art.comp.sub),M,16.5);doc.text(pdfT('Generated '+fmtDate(new Date(),true)),W-M,11,{align:'right'})};
  header();let y=26;
  const K=art.comp.kpis;
  if(K.length){const gap=4,bw=(W-2*M-gap*(K.length-1))/K.length,bh=21;K.forEach((k,i)=>{const x=M+i*(bw+gap);doc.setFillColor(...tint);doc.roundedRect(x,y,bw,bh,2,2,'F');doc.setFillColor(...hexRgb(k.color));doc.rect(x,y,1.6,bh,'F');doc.setTextColor(107,114,128);doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text(pdfT(k.label.toUpperCase()),x+5,y+5.5,{maxWidth:bw-7});doc.setTextColor(...head);doc.setFontSize(15);doc.text(pdfT(k.txt),x+5,y+13.5);doc.setFont('helvetica','normal');doc.setFontSize(6.8);if(k.deltaTxt){doc.setTextColor(...(k.delta>=0?[19,122,69]:[192,57,43]));doc.text(pdfT(k.deltaTxt),x+5,y+18.3,{maxWidth:bw-7})}});y+=bh+6}
  const rowsOf=[];let pend=null;dash.widgets.forEach((w,i)=>{if(w.w===2){if(pend!==null){rowsOf.push([pend]);pend=null}rowsOf.push([i])}else if(pend!==null){rowsOf.push([pend,i]);pend=null}else pend=i});if(pend!==null)rowsOf.push([pend]);
  const cw=(W-2*M-6)/2;
  for(const items of rowsOf){
    const hs=items.map(i=>{const w=dash.widgets[i];const ww=w.w===2?W-2*M:cw;if(w.type==='table'||!art.imgs[i])return 9+Math.min(12,art.comp.wd[i].table.rows.length+1)*5.6;const im=art.imgs[i];return 8+ww*im.h/im.w});
    const h=Math.max(...hs);if(y+h>H-M){doc.addPage();header();y=26}
    let maxY=y+h;
    items.forEach((i,slot)=>{const w=dash.widgets[i];const wide=w.w===2;const x=wide?M:M+slot*(cw+6);const ww=wide?W-2*M:cw;
      doc.setTextColor(...head);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(pdfT(w.title),x,y+4);doc.setDrawColor(...hexRgb(w.color||t.acc));doc.setLineWidth(.6);doc.line(x,y+5.8,x+ww,y+5.8);
      if(w.type==='table'||!art.imgs[i]){const tb=art.comp.wd[i].table;if(!tb.cols.length)return;const kinds=colKinds(tb);
        doc.autoTable({startY:y+8,margin:{left:x,right:W-x-ww},tableWidth:ww,head:[tb.cols.map(pdfT)],body:tb.rows.slice(0,12).map(r=>kinds.map(k=>pdfT(fmtKind(r[k.col],k.kind)))),theme:'grid',styles:{fontSize:7.5,cellPadding:1.3,lineColor:[226,230,238],textColor:[31,41,55]},headStyles:{fillColor:head,textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:tint},columnStyles:Object.fromEntries(kinds.map((k,j)=>[j,{halign:['int','dec','money','pct','frac'].includes(k.kind)?'right':'left'}]))});
        maxY=Math.max(maxY,doc.lastAutoTable.finalY+2)}
      else{const im=art.imgs[i];doc.addImage(im.jpg||im.img,im.jpg?'JPEG':'PNG',x,y+8,ww,ww*im.h/im.w,undefined,'FAST')}});
    y=maxY+5;
  }
  // insights page
  try{const {items,recs}=buildInsights();doc.addPage();header();y=28;
    const sec=(title,list)=>{doc.setTextColor(...head);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(title,M,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(31,41,55);
      for(const s of list){const lines=doc.splitTextToSize(pdfT(s),W-2*M-6);if(y+lines.length*4.4>H-M){doc.addPage();header();y=28}doc.text('-',M,y);doc.text(lines,M+4,y);y+=lines.length*4.4+1.6}y+=4};
    sec('Key findings',items.map(i=>`${i.title}: ${i.text}`));sec('Recommended actions',recs.map(r=>r.t));
  }catch(e){}
  const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);doc.setFontSize(7.5);doc.setTextColor(150,150,150);doc.text('DataDesk report',M,H-5);doc.text(`Page ${p} of ${n}`,W-M,H-5,{align:'right'})}
  return doc.output('blob');
}
async function exportDash(kind){
  toast(`Building ${kind==='png'?'chart images':kind.toUpperCase()}…`);const dash=S.dash||(S.dash=autoDash());const art=await dashArtifacts(dash);const base=(dash.title||'dashboard').replace(/[^\w-]+/g,'_');
  if(kind==='xlsx')return saveBlob(base+'.xlsx',dashExcel(dash,art));
  if(kind==='pdf')return saveBlob(base+'.pdf',dashPDF(dash,art));
  const z=new JSZip();art.imgs.forEach((im,i)=>{if(im)z.file(`${String(i+1).padStart(2,'0')}_${dash.widgets[i].title.replace(/[^\w-]+/g,'_')}.png`,im.img.split(',')[1],{base64:true})});return saveBlob(base+'_charts.zip',z.generateAsync({type:'blob'}));
}

function emailHTML(text,dash,art,snapshot,cid){
  const t=theme();

    return `<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:4px 0 14px"><tr><td colspan="${Math.max(1,K.length)}" style="background:${t.head};color:#ffffff;padding:10px 14px;font-size:15px;font-weight:bold">${esc(dash.title)}<br><span style="font-weight:normal;font-size:11.5px;color:#dfe6f3">${esc(art.comp.sub)}</span></td></tr><tr>${K.map(k=>`<td style="background:${t.tint};border-left:4px solid ${k.color};border-right:2px solid #ffffff;padding:10px 14px;min-width:110px;vertical-align:top"><div style="font-size:10.5px;color:#6b7280;font-weight:bold;text-transform:uppercase">${esc(k.label)}</div><div style="font-size:20px;font-weight:bold;color:${t.head}">${esc(k.txt)}</div>${k.deltaTxt?`<div style="font-size:11px;color:${k.delta>=0?'#137a45':'#c0392b'};white-space:nowrap">${k.delta>=0?'▲':'▼'} ${Math.abs(k.delta*100).toFixed(1)}% vs prev. month</div>`:''}</td>`).join('')}</tr></table>
    ${imgs.map((m,j)=>`<div style="margin:0 0 14px"><div style="font-weight:bold;color:${t.head};margin-bottom:4px;font-size:13px">${esc(dash.widgets[m.i].title)}</div><img src="${cid?'cid:chart'+(j+1):m.img}" width="620" style="width:620px;max-width:100%;border:1px solid #e5e7eb;display:block" alt="${esc(dash.widgets[m.i].title)}"></div>`).join('')}`};
  let html='';let placed=false;
  for(const b of String(text).split(/\n{2,}/)){
    if(b.trim()==='[DASHBOARD SNAPSHOT]'){if(snapshot)html+=snap();placed=true;continue}
    const lines=b.split('\n').filter(l=>l.trim()!=='[DASHBOARD SNAPSHOT]');const isB=l=>/^\s*[•\-*]\s+/.test(l);const bl=lines.filter(isB);
    if(bl.length&&lines.slice(isB(lines[0])?0:1).every(isB)){html+=(isB(lines[0])?'':`<p style="margin:0 0 4px">${esc(lines[0])}</p>`)+`<ul style="margin:0 0 14px;padding-left:22px">${bl.map(l=>`<li style="margin:2px 0">${esc(l.replace(/^\s*[•\-*]\s+/,''))}</li>`).join('')}</ul>`}
    else html+=`<p style="margin:0 0 14px">${lines.map(esc).join('<br>')}</p>`;
  }

  return `<div style="font-family:Segoe UI,Calibri,Arial,sans-serif;font-size:14px;line-height:1.5;color:#1f2937">${html}</div>`;
}
function utf8b64(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)}
async function blobB64(blob){const u=new Uint8Array(await blob.arrayBuffer());let bin='';for(let i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)}
const wrap76=s=>(s.match(/.{1,76}/g)||['']).join('\r\n');
const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf',csv:'text/csv',xls:'application/vnd.ms-excel',json:'application/json',zip:'application/zip',html:'text/html',tsv:'text/tab-separated-values',ods:'application/vnd.oasis.opendocument.spreadsheet',png:'image/png'};
const encWord=s=>/^[\x20-\x7E]*$/.test(s)?s:`=?UTF-8?B?${utf8b64(s)}?=`;
async function buildEml({to,cc,subject,text,html,attachments=[],inline=[]}){
  const r=Math.random().toString(36).slice(2,10);const B1='mix_'+r,B2='rel_'+r,B3='alt_'+r;const L=[];
  if(to)L.push('To: '+to.replace(/;\s*/g,', '));if(cc)L.push('Cc: '+cc.replace(/;\s*/g,', '));
  L.push('Subject: '+encWord(subject||''),'X-Unsent: 1','MIME-Version: 1.0',`Content-Type: multipart/mixed; boundary="${B1}"`,'',`--${B1}`,`Content-Type: multipart/related; boundary="${B2}"`,'',`--${B2}`,`Content-Type: multipart/alternative; boundary="${B3}"`,'',
    `--${B3}`,'Content-Type: text/plain; charset="utf-8"','Content-Transfer-Encoding: base64','',wrap76(utf8b64(text)),'',
    `--${B3}`,'Content-Type: text/html; charset="utf-8"','Content-Transfer-Encoding: base64','',wrap76(utf8b64(`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${html}</body></html>`)),'',`--${B3}--`,'');
  for(const im of inline)L.push(`--${B2}`,'Content-Type: image/png',`Content-ID: <${im.cid}>`,`Content-Disposition: inline; filename="${im.cid}.png"`,'Content-Transfer-Encoding: base64','',wrap76(im.b64),'');
  L.push(`--${B2}--`,'');
  for(const a of attachments){const ext=a.name.split('.').pop().toLowerCase();const nm=encWord(a.name);L.push(`--${B1}`,`Content-Type: ${MIME[ext]||'application/octet-stream'}; name="${nm}"`,`Content-Disposition: attachment; filename="${nm}"`,'Content-Transfer-Encoding: base64','',wrap76(await blobB64(await a.blob)),'')}
  L.push(`--${B1}--`,'');
  return new Blob([L.join('\r\n')],{type:'message/rfc822'});
}
const plainText=t=>String(t).replace(/\n?\[DASHBOARD SNAPSHOT\]\n?/,'\n').replace(/\n{3,}/g,'\n\n');
async function emailFiles(dash,art,att,data,name,fmt){
  const base=(dash.title||'report').replace(/[^\w-]+/g,'_');const out=[];
  if(att.xlsx)out.push({name:base+'.xlsx',blob:dashExcel(dash,art)});
  if(att.pdf)out.push({name:base+'.pdf',blob:dashPDF(dash,art)});
  if(att.data)out.push({name:`${name}.${fmt}`,blob:fileBytes(data,fmt)});
  if(att.report)out.push({name:`${name}_analysis_report.xlsx`,blob:analysisReportBlob()});
  return out;
}
async function makeEmlFor(dash,art,em,data,name,fmt){
  const atts=await emailFiles(dash,art,em.att,data,name,fmt);
  const inline=em.snap?art.imgs.filter(Boolean).slice(0,2).map((m,j)=>({cid:'chart'+(j+1),b64:m.img.split(',')[1]})):[];
  return buildEml({to:em.to,cc:em.cc,subject:em.subject,text:plainText(em.text),html:emailHTML(em.text,dash,art,em.snap,true),attachments:atts,inline});
}

   </div>
   <div class="card"><h2>Preview</h2><div class="em-prev"><div class="em-h"><div><span class="muted">To:</span> <span id="pvTo"></span></div><div id="pvCcRow"><span class="muted">Cc:</span> <span id="pvCc"></span></div><div><span class="muted">Subject:</span> <b id="pvSub"></b></div><div id="pvAtt" class="pv-att"></div></div><div id="pvBody" class="em-b"><div class="muted">Building preview…</div></div></div></div>

},async after(){
  const em=S.ui.em;

    $('#pvTo').textContent=em.to||'(add recipients)';$('#pvCc').textContent=em.cc;$('#pvCcRow').style.display=em.cc?'':'none';$('#pvSub').textContent=em.subject;

    if(S.emailArt&&document.getElementById('pvBody'))$('#pvBody').innerHTML=emailHTML(em.text,S.dash,S.emailArt,em.snap,false);
    const mt=`mailto:${encodeURIComponent(em.to.replace(/;\s*/g,','))}?${em.cc?'cc='+encodeURIComponent(em.cc.replace(/;\s*/g,','))+'&':''}subject=${encodeURIComponent(em.subject)}&body=${encodeURIComponent(plainText(em.text).slice(0,1800))}`;$('#mailtoA').href=mt;};

  $('#emSign').onchange=e=>{const old=SET.signName;SET.signName=e.target.value;saveSettings();const b=$('#emBody');b.value=old&&b.value.trimEnd().endsWith(old)?b.value.trimEnd().slice(0,-old.length)+SET.signName:b.value.replace(/Regards,\n?$/,'Regards,\n'+SET.signName);upd()};
  $$('[data-att]').forEach(c=>c.onchange=()=>{em.att[c.dataset.att]=c.checked;c.parentElement.classList.toggle('on',c.checked);upd()});

async function makeEmail(){const em=S.ui.em;if(!em.to)toast('Tip: add a recipient — you can also add it in Outlook');toast('Building email with attachments…');
  const art=S.emailArt||await dashArtifacts(S.dash);const eml=await makeEmlFor(S.dash,art,em,S.data,S.name,S.srcFormat);
  await saveBlob(`${(S.dash.title||'report').replace(/[^\w-]+/g,'_')}_email.eml`,eml)}
async function downloadAttachments(){const em=S.ui.em;const art=S.emailArt||await dashArtifacts(S.dash);const files=await emailFiles(S.dash,art,em.att,S.data,S.name,S.srcFormat);if(!files.length)return toast('No attachments selected','bad');
  if(files.length===1)return saveBlob(files[0].name,files[0].blob);const z=new JSZip();for(const f of files)z.file(f.name,await f.blob);saveBlob('attachments.zip',z.generateAsync({type:'blob'}))}
async function copyEmail(){const em=S.ui.em;try{await navigator.clipboard.writeText(`${em.subject}\n\n${plainText(em.text)}`);toast('Copied subject & message','good')}catch(e){modal(`<h2>Copy manually</h2><textarea class="i" style="width:100%;height:300px">${esc(em.subject+'\n\n'+plainText(em.text))}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="closeModal()">Close</button></div>`)}}

/* ---------------- SETTINGS ---------------- */
function fmtKind(v,kind){const x=normVal(v,kind);if(x===null)return '';if(isDate(x))return fmtDate(x,kind==='datetime');if(typeof x!=='number')return String(x);const loc=LOC();
  switch(kind){case 'money':return (SET.currency?SET.currency+' ':'')+x.toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2});case 'dec':return x.toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2});case 'int':return x.toLocaleString(loc,{maximumFractionDigits:0});case 'pct':return x.toFixed(2)+'%';case 'frac':return (x*100).toFixed(2)+'%';default:return String(x)}}
function saveSettings(){store.set('settings',SET);applyTheme()}
function xlPreviewHTML(){
  const t=theme();const d=S.data?{cols:S.data.cols.slice(0,9),rows:S.data.rows.slice(0,8)}:{cols:['Order ID','Order Date','Region','ICCID','Quantity','Revenue','Margin %'],rows:[0,1,2,3,4,5].map(i=>({'Order ID':'ORD'+(1001+i),'Order Date':new Date(2026,i,3+i),'Region':['North','South','East','West','North','East'][i],'ICCID':'8991000000000000'+(1234+i),'Quantity':i+2,'Revenue':125000*(i+1)+0.5,'Margin %':18.5+i}))};
  const kinds=colKinds(d);
  return `<div class="xl" style="--h:${t.head};--t:${t.tint};--a:${t.acc};font-family:${SET.font},Calibri,Arial,sans-serif;font-size:${SET.fontSize+1}px">${SET.dataTitle?`<div class="xl-title">${esc((S.name||'Data').replace(/_/g,' '))}</div>`:''}<table class="${SET.borders?'b':''}"><thead><tr><th class="rn"></th>${d.cols.map((c,j)=>`<th>${esc(c)}<div class="kind">${KIND_LABEL[kinds[j].kind]}</div></th>`).join('')}</tr></thead><tbody>${d.rows.map((r,i)=>`<tr class="${SET.zebra&&i%2?'z':''}"><td class="rn">${i+2}</td>${kinds.map(k=>`<td style="text-align:${ALIGN[k.kind]}">${esc(fmtKind(r[k.col],k.kind))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
VIEWS.settings={html(){const s=SET;const sel=(k,arr)=>`<select class="i" data-set="${k}">${arr.map(([v,l])=>`<option value="${esc(v)}"${String(s[k])===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const chk=(k,l)=>`<label class="chk"><input type="checkbox" data-set="${k}" ${s[k]?'checked':''}> ${l}</label>`;
  return `<h1>Output formatting & theme</h1><p class="sub">Applies to every file the portal creates — Excel data files, reports, dashboards, PDFs and emails. Saved in this browser.</p>
  <div class="grid g2">
   <div class="card"><h2>📅 Dates & numbers</h2><div class="grid g2">
    <label class="f">Date format (used everywhere)${sel('dateFmt',[['DD-MM-YYYY','DD-MM-YYYY  (09-11-2026)'],['DD/MM/YYYY','DD/MM/YYYY  (09/11/2026)'],['DD-MMM-YYYY','DD-MMM-YYYY  (09-Nov-2026)'],['YYYY-MM-DD','YYYY-MM-DD  (2026-11-09)'],['MM/DD/YYYY','MM/DD/YYYY  (11/09/2026)']])}</label>
    <label class="f">Number grouping${sel('numStyle',[['indian','Indian — 12,34,567.00 · Lakh / Crore'],['intl','International — 1,234,567.00 · K / M']])}</label>
    <label class="f">Currency symbol on amount columns${sel('currency',[['','None'],['₹','₹ Rupee'],['Rs.','Rs.'],['$','$ Dollar'],['€','€ Euro']])}</label>
    <label class="f">CSV long numbers${sel('csvProtect',[['false','Plain values'],['true','Protect for Excel (="8991…")']])}</label></div>
    <div class="hint" style="margin-top:12px">Every output column gets one correct type: <b>dates</b> become real Excel dates in one format, <b>long numbers</b> (ICCID, IMEI, mobile, account) stay as text so no digits are lost, <b>amounts</b> get 2 decimals and grouping, <b>whole numbers</b> stay whole. You can override a column below.</div></div>
   <div class="card"><h2>🎨 Colours & style</h2>
    <div class="themes">${Object.entries(THEMES).map(([k,v])=>`<button class="th ${s.theme===k?'on':''}" data-th="${k}"><span class="th-sw" style="background:${v.head}"></span><span class="th-sw" style="background:${BASE_PAL[v.order[0]]}"></span><span class="th-sw" style="background:${v.tint}"></span>${v.name}</button>`).join('')}</div>
    <div class="grid g2" style="margin-top:10px"><label class="f">Custom header colour<input type="color" class="i clr" data-set="headerColor" value="${s.headerColor||theme().head}"></label><label class="f">Custom main chart colour<input type="color" class="i clr" data-set="chartColor" value="${s.chartColor||PAL[0]}"></label>
     <label class="f">Font${sel('font',[['Calibri','Calibri'],['Aptos','Aptos'],['Arial','Arial'],['Segoe UI','Segoe UI'],['Verdana','Verdana']])}</label><label class="f">Font size${sel('fontSize',[[10,'10'],[11,'11'],[12,'12']])}</label></div>
    ${s.headerColor||s.chartColor?`<button class="btn sm" style="margin-top:8px" onclick="SET.headerColor='';SET.chartColor='';saveSettings();render()">Reset to theme colours</button>`:''}
    <div class="row" style="gap:14px;margin-top:12px">${chk('zebra','Striped rows')}${chk('borders','Cell borders')}${chk('freeze','Freeze header row')}${chk('filter','Filter buttons')}${chk('totals','Totals row in reports')}${chk('dataTotals','Totals row in data files')}${chk('dataTitle','Title rows in data files')}</div>
    <p class="small muted" style="margin-bottom:0">Tip: keep “Title rows in data files” off when the file will be uploaded to a portal — the header stays in row 1.</p></div>
  </div>
  <div class="card"><div class="row sp"><h2 style="margin:0">Live preview — Excel output</h2>${S.data?`<button class="btn sm" onclick="exportData({cols:S.data.cols,rows:S.data.rows.slice(0,300)},S.name+'_style_preview','xlsx')">⬇ Download preview (.xlsx)</button>`:''}</div><div style="margin-top:12px;overflow:auto">${xlPreviewHTML()}</div></div>
  ${S.data?`<div class="card"><h2>Column types in output files</h2><p class="muted small">Detected automatically for <b>${esc(S.name)}</b>. Change any column if needed.</p><div class="tw" style="max-height:380px"><table class="t"><thead><tr><th>Column</th><th>Output type</th><th>Example in output</th><th>Alignment</th></tr></thead><tbody>${colKinds(S.data).map(k=>{const ex=S.data.rows.find(r=>!isBlank(r[k.col]));return `<tr><td><b>${esc(k.col)}</b></td><td><select class="i kindSel" data-col="${esc(k.col)}">${Object.entries(KIND_LABEL).filter(([x])=>x!=='frac').map(([x,l])=>`<option value="${x}"${x===(k.kind==='frac'?'pct':k.kind)?' selected':''}>${l}</option>`).join('')}</select>${S.kindOverride&&S.kindOverride[k.col]?' <span class="pill warn">manual</span>':''}</td><td>${esc(ex?fmtKind(ex[k.col],k.kind):'')}</td><td class="muted">${ALIGN[k.kind]}</td></tr>`}).join('')}</tbody></table></div></div>`:''}`;
},after(){
  $$('[data-set]').forEach(el=>el.onchange=()=>{const k=el.dataset.set;let v=el.type==='checkbox'?el.checked:el.value;if(k==='csvProtect')v=v==='true';if(k==='fontSize')v=+v;SET[k]=v;saveSettings();render()});
  $$('.th').forEach(b=>b.onclick=()=>{SET.theme=b.dataset.th;SET.headerColor='';SET.chartColor='';saveSettings();render()});
  $$('.kindSel').forEach(s=>s.onchange=()=>{S.kindOverride=S.kindOverride||{};S.kindOverride[s.dataset.col]=s.value;toast(`${s.dataset.col} → ${KIND_LABEL[s.value]}`,'good');render()});
}};

function getAgents(){return store.get('agents',[])}
function setAgents(a){if(!store.set('agents',a))toast('Could not save in this browser — use Export to keep agents','bad')}

  return `<h1>Automation Agents</h1><p class="sub">Agents repeat your daily work in one click: drop tomorrow's files on an agent and it merges, cleans, analyses, builds the dashboard and creates the email or files automatically.</p>

   ${S.steps.length||S.dash?`${S.steps.length?`<div class="steps" style="margin:12px 0">${S.steps.map((s,i)=>`<div class="step"><span class="no">${i+1}</span><span style="flex:1">${esc(s.label)}</span><button class="btn sm ghost" onclick="S.steps.splice(${i},1);refresh()">✕</button></div>`).join('')}</div>`:'<p class="muted small">No cleaning steps recorded — the agent will use your current dashboard only.</p>'}
   <div class="grid g4"><label class="f">Agent name<input class="i" id="agN" placeholder="e.g. Daily ICCID usage report"></label>

    <label class="f">Split into batches of (rows, 0 = no)<input class="i" id="agB" type="number" value="0" min="0"></label></div>
   ${o==='email'?`<div class="grid g3" style="margin-top:10px"><label class="f">Email To<input class="i" id="agTo" value="${esc(SET.emailTo)}"></label><label class="f">Cc<input class="i" id="agCc" value="${esc(SET.emailCc)}"></label><label class="chk" style="align-self:end"><input type="checkbox" id="agAD"> Also attach the data file</label></div>`:''}
   ${['email','dashboard'].includes(o)?`<p class="small muted">${S.dash?`Uses your current dashboard “${esc(S.dash.title)}” (${S.dash.kpis.length} KPIs, ${S.dash.widgets.length} charts).`:'No dashboard built yet — the agent will auto-build one on each run.'}</p>`:''}

function agentCard(a,mine){return `<div class="agent"><div class="top2"><div class="av">${a.icon||'⚙'}</div><div style="flex:1"><b>${esc(a.name)}</b><div class="small muted">${a.steps.length} step(s) · ${OUT_LABEL[a.output]||a.output}${a.output==='data'?` · ${a.format==='same'?'same format as input':'.'+a.format}`:''}${a.batch?` · batches of ${a.batch.toLocaleString()}`:''}</div></div>${mine?`<button class="btn sm ghost" title="Delete" onclick="delAgent('${a.id}')">✕</button>`:''}</div>
  <div class="small muted">${esc(a.desc||a.steps.map(s=>s.label||OPS[s.op].label(s.params)).join(' → ')||'Dashboard only')}</div>

  <div class="row"><button class="btn sm" ${S.data?'':'disabled'} onclick="runAgentById('${a.id}',null)">▶ Run on current data</button></div></div>`}
function saveAgent(){
  const name=$('#agN').value.trim()||`My agent ${getAgents().length+1}`;const output=$('#agO').value;
  const a={id:'u_'+Date.now(),name,icon:output==='email'?'✉':output==='dashboard'?'▣':'⚙',merge:'append',addSource:$('#agS').checked,steps:S.steps.map(s=>({op:s.op,params:s.params,label:s.label})),format:$('#agF').value,batch:Math.max(0,+$('#agB').value||0),output,created:new Date().toISOString()};
  if(['email','dashboard'].includes(output)&&S.dash)a.dash=JSON.parse(JSON.stringify(S.dash));
  if(output==='email'){a.to=$('#agTo').value;a.cc=$('#agCc').value;a.attachData=$('#agAD').checked}
  const all=getAgents();all.push(a);setAgents(all);toast(`Agent “${name}” saved — drop files on it any time`,'good');render();

function delAgent(id){setAgents(getAgents().filter(a=>a.id!==id));render()}
function exportAgents(){const a=getAgents();if(!a.length)return toast('No saved agents to export');saveBlob('datadesk_agents.json',new Blob([JSON.stringify(a,null,2)],{type:'application/json'}))}
async function runAgentById(id,files){
  const a=[...getAgents(),...BUILTIN].find(x=>x.id===id);if(!a)return;
  const logEl=$('#agLog');const lines=[];const log=m=>{lines.push(`[${new Date().toLocaleTimeString()}] ${m}`);if(logEl)logEl.innerHTML=`<div class="card"><h2>▶ ${esc(a.name)}</h2><div class="log">${esc(lines.join('\n'))}</div></div>`;};
  logEl&&logEl.scrollIntoView({behavior:'smooth'});
  const prev={data:S.data,name:S.name,pc:S.profileCache,fmt:S.srcFormat};
  try{
    let tabs,fmtIn,base;
    if(files&&files.length){log(`Reading ${files.length} file(s)…`);tabs=[];for(const f of files){await ingest(f.name,await f.arrayBuffer(),tabs)}log(`Found ${tabs.length} table(s): ${tabs.map(t=>`${t.label} [${t.verified}, ${t.rows.length} rows]`).join('; ')}`);if(!tabs.length)throw new Error('No readable data in the files');fmtIn=tabs[0].outFmt;base=tabs.length>1?`merged_${tabs.length}_files`:tabs[0].file.replace(/\.[^.]+$/,'')}
    else{tabs=[{label:S.name,cols:S.data.cols,rows:S.data.rows}];fmtIn=S.srcFormat;base=S.name;log(`Using current data: ${S.data.rows.length} rows`)}
    let d=tabs.length===1&&!a.addSource?{cols:tabs[0].cols,rows:tabs[0].rows}:appendTables(tabs,{source:a.addSource});
    if(tabs.length>1)log(`Merged → ${d.rows.length.toLocaleString()} rows × ${d.cols.length} columns`);
    for(const st of a.steps){const r=OPS[st.op].run(d,st.params);d=r.data;log(`✓ ${st.label||OPS[st.op].label(st.params)} — ${r.msg}`)}
    const fmt=a.format==='same'?fmtIn:a.format;const stamp=fmtDate(new Date(),false).replace(/[\/ ]/g,'-');
    S.data=d;S.name=base;S.profileCache=null;
    if(a.output==='data'){await exportData(d,`${base}_processed_${stamp}`,fmt,a.batch);log(`⬇ Output: ${d.rows.length.toLocaleString()} rows as styled .${fmt}${a.batch?` in batches of ${a.batch}`:''}`)}
    else if(a.output==='dashboard'||a.output==='email'){
      const dash=fixDash(a.dash)||autoDash();log(`Building dashboard “${dash.title}” — ${dash.kpis.length} KPIs, ${dash.widgets.length} charts`);
      const art=await dashArtifacts(dash);const fb=(dash.title||'dashboard').replace(/[^\w-]+/g,'_');
      if(a.output==='dashboard'){const z=new JSZip();z.file(`${fb}_${stamp}.xlsx`,await dashExcel(dash,art));z.file(`${fb}_${stamp}.pdf`,dashPDF(dash,art));await saveBlob(`${fb}_${stamp}.zip`,z.generateAsync({type:'blob'}));log('⬇ Dashboard Excel + PDF downloaded (ZIP)')}
      else{const em={...emailDefaults(dash,art.comp),to:a.to||SET.emailTo,cc:a.cc||SET.emailCc,att:{xlsx:true,pdf:true,data:!!a.attachData,report:false},snap:true};
        const eml=await makeEmlFor(dash,art,em,d,`${base}_${stamp}`,fmt);await saveBlob(`${fb}_${stamp}_email.eml`,eml);log(`✉ Outlook draft ready — subject “${em.subject}”${em.to?' to '+em.to:''}. Open the .eml and press Send.`)}
    }
    else{const blob=a.output==='revenue'?revenueWorkbook():qualityWorkbook();await saveBlob(`${base}_${a.output==='revenue'?'revenue_report':'quality_report'}_${stamp}.xlsx`,blob);log('⬇ Styled Excel report generated')}
    log('Done ✔');S.lastAgentOutput=d;
    const runs=store.get('runs',[]);runs.unshift({agent:a.name,when:new Date().toLocaleString(),summary:`${d.rows.length.toLocaleString()} rows → ${OUT_LABEL[a.output]}`});store.set('runs',runs.slice(0,30));
    if(logEl)logEl.querySelector('.card').insertAdjacentHTML('beforeend',`<div class="row" style="margin-top:10px"><button class="btn sm" onclick="loadData(S.lastAgentOutput,'${esc(base)}_processed','${fmt}')">Open result in Analysis</button></div>`);
  }catch(e){console.error(e);log('✕ Error: '+e.message);toast(e.message,'bad')}
  finally{S.data=prev.data;S.name=prev.name;S.profileCache=prev.pc;S.srcFormat=prev.fmt}
}

function insightsSheet(){const {items,recs}=buildInsights();return [['Analysis report',String(S.name).replace(/_/g,' ')],['Generated',fmtDate(new Date(),true)],[],['FINDING','DETAIL'],...items.map(i=>[i.title,i.text]),[],['RECOMMENDED ACTION'],...recs.map(r=>[r.t])]}
function qualityWorkbook(){return workbookBlob([['Summary',insightsSheet()],['Column Profile',describeTable(),{title:'Column profile'}],['Missing by column',{cols:['Column','Blank cells','% Blank'],rows:profile().map(p=>({Column:p.col,'Blank cells':p.missing,'% Blank':Math.round(p.missing/Math.max(1,p.count)*1000)/10}))},{title:'Missing values by column',totals:false,heat:['% Blank']}]])}
function revenueWorkbook(){
  const val=guessValueCol(),dc=guessDateCol(),cat=guessCatCols()[0];const sheets=[['Summary',insightsSheet()]];

/* ---------------- sample data ---------------- */
function loadSample(){
  const regions=['North','South','East','West','Central'],prods=[['Laptop',52000],['Phone',18000],['Tablet',24000],['Monitor',11000],['Headphones',2500],['Router',3200]],reps=['Amit','Priya','Rahul','Sneha','Vikram','Neha'];
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const rows=[];const start=new Date(2024,0,1);
  for(let m=0;m<23;m++){const season=1+.25*Math.sin((m%12)/12*2*Math.PI-1)+(m%12===9||m%12===10?.35:0);const n=Math.round(38*season*(1+m*.02));
    for(let i=0;i<n;i++){const d=new Date(start.getFullYear(),start.getMonth()+m,1+Math.floor(rnd()*28));const [p,price]=prods[Math.floor(rnd()*prods.length)];const reg=regions[Math.floor(rnd()**1.4*regions.length)];const q=1+Math.floor(rnd()*5);const pr=Math.round(price*(.9+rnd()*.2));
      rows.push({'Order ID':'ORD'+(100000+rows.length),'Order Date':i%9===0?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:d,'Region':i%23===0?'  '+reg.toLowerCase()+' ':reg,'Product':p,'Sales Rep':rnd()<.04?'':reps[Math.floor(rnd()*reps.length)],'Quantity':q,'Unit Price':pr,'Revenue':i%17===0?`₹${(q*pr).toLocaleString('en-IN')}`:q*pr,'Cost':Math.round(q*pr*(.62+rnd()*.18)),'Customer Mobile':'9'+String(Math.floor(rnd()*1e9)).padStart(9,'0')})}}
  for(let i=0;i<25;i++)rows.push({...rows[Math.floor(rnd()*rows.length)]});
  rows.push({'Order ID':'','Order Date':'','Region':'','Product':'','Sales Rep':'','Quantity':'','Unit Price':'','Revenue':'','Cost':'','Customer Mobile':''});
  const t=mkTable({label:'sample_sales.xlsx',file:'sample_sales.xlsx',ext:'xlsx',real:'xlsx',note:'demo',cols:Object.keys(rows[0]),rows});
  S.tables.push(t);loadData({cols:t.cols,rows:t.rows},'sample_sales','xlsx');
  toast('Sample loaded — try “auto clean the data”, then Insights, Forecast, Revenue & Planning');
}
